<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>20 LPA Interview Cracker</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07090f;--bg2:#0d1117;--bg3:#161b26;--card:#111520;--card2:#171d2e;
  --border:rgba(255,255,255,0.06);--border2:rgba(255,255,255,0.11);--border3:rgba(255,255,255,0.18);
  --cyan:#00d4ff;--cyan-dim:rgba(0,212,255,0.1);--cyan-glow:rgba(0,212,255,0.2);
  --purple:#8b5cf6;--purple-dim:rgba(139,92,246,0.12);
  --green:#10b981;--green-dim:rgba(16,185,129,0.12);
  --amber:#f59e0b;--amber-dim:rgba(245,158,11,0.12);
  --red:#ef4444;--red-dim:rgba(239,68,68,0.12);
  --text:#dde1ed;--text2:#8892a4;--text3:#3d4657;
  --fh:'Syne',sans-serif;--fb:'Plus Jakarta Sans',sans-serif;--fm:'JetBrains Mono',monospace;
  --r6:6px;--r8:8px;--r10:10px;--r12:12px;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;overflow:hidden;}
body{background:var(--bg);color:var(--text);font-family:var(--fb);display:flex;flex-direction:column;font-size:14px;}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 70% 50% at 20% 0%,rgba(0,212,255,0.04) 0%,transparent 60%),radial-gradient(ellipse 50% 40% at 80% 100%,rgba(139,92,246,0.04) 0%,transparent 60%);pointer-events:none;z-index:0;}

/* ── HEADER ── */
header{position:relative;z-index:100;background:rgba(7,9,15,0.96);backdrop-filter:blur(16px);border-bottom:1px solid var(--border2);padding:0 24px;height:56px;display:flex;align-items:center;gap:18px;flex-shrink:0;}
.logo{font-family:var(--fh);font-size:16px;font-weight:800;letter-spacing:-0.5px;display:flex;align-items:center;gap:8px;white-space:nowrap;color:#fff;}
.logo em{background:var(--cyan);color:#07090f;font-style:normal;font-size:9.5px;font-weight:700;padding:2px 6px;border-radius:3px;font-family:var(--fm);letter-spacing:1px;}
.hpbar{flex:1;display:flex;align-items:center;gap:10px;max-width:380px;}
.hpbar-track{flex:1;height:4px;background:var(--bg3);border-radius:2px;overflow:hidden;}
.hpbar-fill{height:100%;background:linear-gradient(90deg,var(--cyan),var(--purple));border-radius:2px;transition:width .6s ease;}
.hpct{font-family:var(--fm);font-size:11px;color:var(--cyan);min-width:30px;}
.hstats{margin-left:auto;display:flex;gap:14px;}
.hstat{display:flex;align-items:center;gap:4px;font-size:10.5px;color:var(--text2);font-family:var(--fm);}
.hdot{width:6px;height:6px;border-radius:50%;}

/* ── LAYOUT ── */
.layout{display:flex;flex:1;position:relative;z-index:1;overflow:hidden;}

/* ── SIDEBAR ── */
aside{width:240px;flex-shrink:0;border-right:1px solid var(--border);padding:10px 0;overflow-y:auto;height:100%;}
aside::-webkit-scrollbar{width:2px;}
aside::-webkit-scrollbar-thumb{background:var(--border2);}
.sc{padding:9px 14px 3px;font-size:8.5px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:var(--text3);font-family:var(--fm);}
.si{display:flex;align-items:center;gap:8px;padding:7px 14px;cursor:pointer;transition:all .14s;border-left:2px solid transparent;font-size:12.5px;color:var(--text2);}
.si:hover{background:var(--bg2);color:var(--text);}
.si.active{background:var(--cyan-dim);border-left-color:var(--cyan);color:#fff;}
.si-ico{font-size:12px;width:15px;text-align:center;flex-shrink:0;}
.si-name{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.si-ct{font-size:9.5px;font-family:var(--fm);color:var(--text3);}
.si.active .si-ct{color:var(--cyan);}
.sdiv{height:1px;background:var(--border);margin:7px 0;}

/* ── MAIN ── */
main{flex:1;overflow-y:auto;padding:22px 26px;height:100%;}
main::-webkit-scrollbar{width:3px;}
main::-webkit-scrollbar-thumb{background:var(--border2);}

/* ── HERO ── */
.hero{padding:26px 0 22px;border-bottom:1px solid var(--border);margin-bottom:22px;}
.hero-eye{font-family:var(--fm);font-size:10px;color:var(--cyan);letter-spacing:2.5px;text-transform:uppercase;margin-bottom:8px;}
.hero-h{font-family:var(--fh);font-size:36px;font-weight:800;letter-spacing:-1.5px;line-height:1.08;margin-bottom:10px;}
.hero-h span{color:var(--cyan);}
.hero-p{font-size:13.5px;color:var(--text2);max-width:480px;line-height:1.7;}

/* ── DASH CARDS ── */
.dash{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:24px;}
.dc{background:var(--card);border:1px solid var(--border);border-radius:var(--r10);padding:16px;position:relative;overflow:hidden;}
.dc::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;}
.dc.cc::before{background:var(--cyan);}
.dc.cg::before{background:var(--green);}
.dc.cp::before{background:var(--purple);}
.dc.ca::before{background:var(--amber);}
.dc-lbl{font-size:9.5px;color:var(--text3);text-transform:uppercase;letter-spacing:1.2px;font-family:var(--fm);margin-bottom:5px;}
.dc-num{font-family:var(--fh);font-size:32px;font-weight:800;line-height:1;margin-bottom:2px;}
.dc.cc .dc-num{color:var(--cyan);}
.dc.cg .dc-num{color:var(--green);}
.dc.cp .dc-num{color:var(--purple);}
.dc.ca .dc-num{color:var(--amber);}
.dc-sub{font-size:11px;color:var(--text2);}

/* ── LAYER SECTION (HOME) ── */
.ls{margin-bottom:24px;}
.ls-head{font-size:9px;text-transform:uppercase;letter-spacing:2px;font-family:var(--fm);margin-bottom:10px;padding-bottom:7px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;}
.ls-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.sc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:9px;}
.scard{background:var(--card);border:1px solid var(--border);border-radius:var(--r10);padding:14px;cursor:pointer;transition:all .18s;}
.scard:hover{border-color:var(--border2);transform:translateY(-2px);}
.scard-top{display:flex;align-items:center;gap:7px;margin-bottom:11px;}
.scard-ico{font-size:15px;}
.scard-name{font-family:var(--fh);font-size:13.5px;font-weight:700;}
.scard-bar{height:3px;background:var(--bg3);border-radius:2px;overflow:hidden;margin-bottom:5px;}
.scard-fill{height:100%;border-radius:2px;transition:width .4s;}
.scard-meta{display:flex;justify-content:space-between;font-size:10.5px;color:var(--text2);}

/* ── SUBJECT VIEW ── */
.sv-header{margin-bottom:18px;}
.layer-badge{display:inline-flex;align-items:center;gap:4px;font-size:9.5px;font-family:var(--fm);text-transform:uppercase;letter-spacing:1px;padding:3px 8px;border-radius:3px;margin-bottom:7px;}
.l1{background:var(--cyan-dim);color:var(--cyan);}
.l2{background:var(--purple-dim);color:#a78bfa;}
.l3{background:var(--amber-dim);color:var(--amber);}
.l4{background:var(--green-dim);color:var(--green);}
.sv-title{font-family:var(--fh);font-size:24px;font-weight:800;letter-spacing:-0.5px;margin-bottom:5px;}
.sv-desc{color:var(--text2);font-size:13px;line-height:1.65;max-width:580px;margin-bottom:12px;}
.sv-meta{display:flex;gap:14px;flex-wrap:wrap;}
.sv-chip{font-size:10.5px;color:var(--text2);font-family:var(--fm);}

/* ── FILTER ── */
.fbar{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap;}
.fb{padding:4px 12px;border-radius:5px;border:1px solid var(--border2);background:transparent;color:var(--text2);font-size:11px;cursor:pointer;transition:all .14s;font-family:var(--fb);}
.fb:hover,.fb.on{background:var(--cyan-dim);border-color:var(--cyan);color:var(--text);}

/* ── TOPIC CARDS ── */
.tgrid{display:flex;flex-direction:column;gap:7px;}
.tc{background:var(--card);border:1px solid var(--border);border-radius:var(--r8);display:flex;align-items:center;gap:12px;border-left:3px solid transparent;transition:all .16s;overflow:hidden;}
.tc:hover{border-color:var(--border2);background:var(--card2);}
.tc.done{border-left-color:var(--green);}
.tc.in_progress{border-left-color:var(--amber);}
.tc-status{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--border2);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;background:transparent;cursor:pointer;transition:all .16s;margin-left:12px;}
.tc.done .tc-status{background:var(--green);border-color:var(--green);color:#fff;}
.tc.in_progress .tc-status{background:rgba(245,158,11,0.15);border-color:var(--amber);color:var(--amber);}
.tc-info{flex:1;min-width:0;padding:11px 0;}
.tc-name{font-size:13px;font-weight:500;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tc.done .tc-name{color:var(--text3);text-decoration:line-through;}
.tc-tags{display:flex;gap:5px;flex-wrap:wrap;}
.tc-tag{font-size:9.5px;background:var(--bg3);border:1px solid var(--border);color:var(--text3);padding:1px 5px;border-radius:3px;font-family:var(--fm);}
.tc-right{display:flex;align-items:center;gap:8px;flex-shrink:0;padding-right:12px;}
.db{font-size:9px;font-family:var(--fm);padding:2px 6px;border-radius:3px;font-weight:500;text-transform:uppercase;letter-spacing:.5px;}
.de{background:var(--green-dim);color:var(--green);}
.dm{background:var(--amber-dim);color:var(--amber);}
.dh{background:var(--red-dim);color:var(--red);}
.hrs{font-size:10px;font-family:var(--fm);color:var(--text3);}
.open-btn{padding:5px 10px;border:1px solid var(--border2);border-radius:5px;background:transparent;color:var(--text2);font-size:10px;cursor:pointer;transition:all .14s;white-space:nowrap;font-family:var(--fb);}
.open-btn:hover{background:var(--cyan-dim);border-color:var(--cyan);color:var(--cyan);}

/* ── DETAIL PANEL ── */
.dp{position:fixed;top:56px;right:0;bottom:0;width:460px;background:var(--bg2);border-left:1px solid var(--border2);z-index:300;overflow-y:auto;transform:translateX(100%);transition:transform .3s cubic-bezier(.4,0,.2,1);}
.dp.open{transform:translateX(0);}
.dp::-webkit-scrollbar{width:3px;}
.dp::-webkit-scrollbar-thumb{background:var(--border2);}
.dp-head{padding:18px 20px 14px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg2);z-index:2;}
.dp-close{position:absolute;top:14px;right:14px;width:26px;height:26px;border-radius:5px;border:1px solid var(--border2);background:transparent;color:var(--text2);cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center;transition:all .14s;}
.dp-close:hover{background:var(--card);color:var(--text);}
.dp-diff{display:inline-flex;align-items:center;font-size:9px;font-family:var(--fm);padding:2px 6px;border-radius:3px;font-weight:500;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px;}
.dp-title{font-family:var(--fh);font-size:17px;font-weight:800;margin-bottom:3px;padding-right:32px;line-height:1.2;}
.dp-meta{font-size:10.5px;color:var(--text3);font-family:var(--fm);}
.dp-body{padding:16px 20px;}
.dps{margin-bottom:18px;}
.dps-lbl{font-size:9px;text-transform:uppercase;letter-spacing:2px;font-family:var(--fm);color:var(--text3);margin-bottom:8px;padding-bottom:5px;border-bottom:1px solid var(--border);}
.dp-desc{font-size:13px;color:var(--text2);line-height:1.75;}
.concept-wrap{display:flex;flex-direction:column;gap:5px;}
.cv{display:flex;align-items:flex-start;gap:8px;font-size:12.5px;color:var(--text);line-height:1.55;padding:8px 10px;background:var(--card);border-radius:6px;border:1px solid var(--border);}
.cv-dot{color:var(--cyan);font-family:var(--fm);font-size:11px;flex-shrink:0;margin-top:1px;}
.qwrap{display:flex;flex-direction:column;gap:5px;}
.qv{display:flex;align-items:flex-start;gap:8px;font-size:12.5px;color:var(--text);line-height:1.55;padding:8px 10px;background:var(--card);border-radius:6px;border:1px solid var(--border);}
.qv-n{color:var(--amber);font-family:var(--fm);font-size:10px;font-weight:700;flex-shrink:0;min-width:18px;margin-top:2px;}
.rwrap{display:flex;flex-direction:column;gap:6px;}
.rl{display:flex;align-items:center;gap:10px;padding:9px 11px;background:var(--card);border:1px solid var(--border);border-radius:7px;text-decoration:none;transition:all .14s;color:var(--text);}
.rl:hover{border-color:var(--cyan);background:var(--cyan-dim);}
.rl-ico{font-size:14px;flex-shrink:0;}
.rl-info{flex:1;min-width:0;}
.rl-name{font-size:12.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.rl-type{font-size:10px;color:var(--text3);font-family:var(--fm);}
.rl-arr{font-size:12px;color:var(--text3);flex-shrink:0;}
.rl:hover .rl-arr{color:var(--cyan);}
.dp-status-bar{display:flex;gap:8px;padding:14px 20px;border-top:1px solid var(--border);position:sticky;bottom:0;background:var(--bg2);}
.dsb{flex:1;padding:8px;border-radius:6px;border:1px solid var(--border2);background:transparent;color:var(--text2);font-size:12px;cursor:pointer;transition:all .14s;font-family:var(--fb);}
.dsb:hover{border-color:var(--border2);background:var(--card);}
.dsb.ds-prog{border-color:var(--amber);color:var(--amber);background:var(--amber-dim);}
.dsb.ds-done{border-color:var(--green);color:var(--green);background:var(--green-dim);}

.sdiv2{display:flex;align-items:center;gap:10px;margin:16px 0 10px;}
.sdiv2-lbl{font-size:9.5px;text-transform:uppercase;letter-spacing:1.5px;font-family:var(--fm);color:var(--text3);white-space:nowrap;}
.sdiv2-line{flex:1;height:1px;background:var(--border);}
.empty{text-align:center;padding:40px 0;color:var(--text3);font-size:13px;}
.overlay{position:fixed;inset:0;background:rgba(7,9,15,0.5);z-index:299;opacity:0;pointer-events:none;transition:opacity .3s;}
.overlay.show{opacity:1;pointer-events:all;}
@keyframes fi{from{opacity:0;transform:translateY(5px);}to{opacity:1;transform:translateY(0);}}
.anim{animation:fi .2s ease;}

/* ── SEARCH BAR ── */
.sidebar-search{padding:6px 14px 12px;position:relative;}
.search-input{width:100%;padding:8px 30px 8px 10px;background:var(--bg2);border:1px solid var(--border2);border-radius:var(--r6);color:var(--text);font-family:var(--fb);font-size:12px;outline:none;transition:border-color .15s, background-color .15s;}
.search-input:focus{border-color:var(--cyan);background:var(--bg3);}
.search-clear{position:absolute;right:22px;top:45%;transform:translateY(-50%);background:transparent;border:none;color:var(--text3);cursor:pointer;font-size:12px;padding:4px;}
.search-clear:hover{color:var(--text);}

/* ── NEON GLOW HOVERS ── */
.tc{border-left-width:3px;transition:border-color .15s, box-shadow .15s, background-color .15s;}
.tc:hover{border-color:var(--cyan);box-shadow:0 0 10px var(--cyan-glow);background:var(--card2);}
.tc.done:hover{border-color:var(--green);box-shadow:0 0 10px rgba(16,185,129,0.08);}
.tc.in_progress:hover{border-color:var(--amber);box-shadow:0 0 10px rgba(245,158,11,0.08);}

/* ── BOOKMARKS & NOTES INDICATORS ── */
.tc-star{font-size:14px;cursor:pointer;color:var(--text3);transition:color .15s, transform .15s;display:inline-flex;align-items:center;justify-content:center;user-select:none;margin-right:2px;}
.tc-star:hover{transform:scale(1.25);color:var(--amber);}
.tc-star.active{color:var(--amber);}
.tc-notes-indicator{font-size:10px;color:var(--cyan);opacity:0.85;margin-left:6px;user-select:none;}

/* ── TABBED DETAIL PANEL ── */
.dp-star-btn{background:transparent;border:1px solid var(--border2);border-radius:var(--r6);width:26px;height:26px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text3);font-size:14px;transition:all .15s;padding:0;line-height:1;}
.dp-star-btn:hover,.dp-star-btn.active{border-color:var(--amber);color:var(--amber);background:rgba(245,158,11,0.08);}
.dp-tabs{display:flex;gap:4px;margin-top:12px;border-bottom:1px solid var(--border);padding-bottom:1px;}
.dp-tab{background:transparent;border:none;border-bottom:2px solid transparent;color:var(--text2);font-family:var(--fb);font-size:12px;font-weight:600;padding:6px 12px;cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:4px;}
.dp-tab:hover{color:var(--text);}
.dp-tab.active{color:var(--cyan);border-bottom-color:var(--cyan);}

/* ── NOTES TAB ── */
.notes-container{display:flex;flex-direction:column;gap:10px;height:100%;animation:fi .15s ease;}
.notes-textarea{width:100%;height:220px;background:var(--card);border:1px solid var(--border);border-radius:var(--r8);color:var(--text);font-family:var(--fb);font-size:13px;line-height:1.6;padding:12px;resize:vertical;outline:none;transition:border-color .15s;}
.notes-textarea:focus{border-color:var(--cyan);}
.notes-meta{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--text2);font-family:var(--fm);}
.notes-save-status{color:var(--green);font-size:11px;opacity:0;transition:opacity .3s;font-weight:500;}
.notes-save-status.show{opacity:1;}
.notes-tips{font-size:11.5px;color:var(--text3);line-height:1.5;background:rgba(255,255,255,0.01);padding:10px;border-radius:var(--r6);border:1px dashed var(--border);margin-top:4px;}
.notes-tips p{margin-top:2px;}

/* ── THEMES ── */
body.theme-cyan {
  --cyan:#00d4ff;--cyan-dim:rgba(0,212,255,0.1);--cyan-glow:rgba(0,212,255,0.2);
}
body.theme-matrix {
  --cyan:#10b981;--cyan-dim:rgba(16,185,129,0.12);--cyan-glow:rgba(16,185,129,0.2);
}
body.theme-solar {
  --cyan:#f59e0b;--cyan-dim:rgba(245,158,11,0.12);--cyan-glow:rgba(245,158,11,0.2);
}
body.theme-royal {
  --cyan:#8b5cf6;--cyan-dim:rgba(139,92,246,0.12);--cyan-glow:rgba(139,92,246,0.2);
}
body.theme-light-cyan {
  --bg:#f8fafc;--bg2:#ffffff;--bg3:#f1f5f9;--card:#ffffff;--card2:#f8fafc;
  --border:rgba(0,0,0,0.05);--border2:rgba(0,0,0,0.09);--border3:rgba(0,0,0,0.15);
  --cyan:#0284c7;--cyan-dim:rgba(2,132,199,0.06);--cyan-glow:rgba(2,132,199,0.12);
  --text:#0f172a;--text2:#475569;--text3:#94a3b8;
}
body.theme-light-green {
  --bg:#f4fbf7;--bg2:#ffffff;--bg3:#eaf6ee;--card:#ffffff;--card2:#f4fbf7;
  --border:rgba(0,0,0,0.05);--border2:rgba(0,0,0,0.09);--border3:rgba(0,0,0,0.15);
  --cyan:#10b981;--cyan-dim:rgba(16,185,129,0.06);--cyan-glow:rgba(16,185,129,0.12);
  --text:#062f21;--text2:#2d5a27;--text3:#6b7280;
}
body.theme-light-rose {
  --bg:#fffbfb;--bg2:#ffffff;--bg3:#fff1f2;--card:#ffffff;--card2:#fffbfb;
  --border:rgba(0,0,0,0.05);--border2:rgba(0,0,0,0.09);--border3:rgba(0,0,0,0.15);
  --cyan:#f43f5e;--cyan-dim:rgba(244,63,94,0.06);--cyan-glow:rgba(244,63,94,0.12);
  --text:#4c0519;--text2:#881337;--text3:#9ca3af;
}

/* ── LIGHT THEME GENERIC OVERRIDES ── */
body[class^="theme-light-"], body[class*=" theme-light-"] {
  background: var(--bg);
  color: var(--text);
}
body[class^="theme-light-"]::before, body[class*=" theme-light-"]::before {
  background: radial-gradient(ellipse 70% 50% at 20% 0%,rgba(0,180,255,0.02) 0%,transparent 60%);
}
body[class^="theme-light-"] header, body[class*=" theme-light-"] header {
  background: rgba(255, 255, 255, 0.95);
  border-bottom-color: var(--border2);
}
body[class^="theme-light-"] .logo, body[class*=" theme-light-"] .logo {
  color: var(--text);
}
body[class^="theme-light-"] .logo em, body[class*=" theme-light-"] .logo em {
  background: var(--cyan);
  color: #fff;
}
body[class^="theme-light-"] .si, body[class*=" theme-light-"] .si {
  color: var(--text2);
}
body[class^="theme-light-"] .si.active, body[class*=" theme-light-"] .si.active {
  color: var(--cyan);
  background: var(--cyan-dim);
}
body[class^="theme-light-"] .si.active .si-ct, body[class*=" theme-light-"] .si.active .si-ct {
  color: var(--cyan);
}
body[class^="theme-light-"] .si-ico, body[class*=" theme-light-"] .si-ico {
  color: var(--text3);
}
body[class^="theme-light-"] .si.active .si-ico, body[class*=" theme-light-"] .si.active .si-ico {
  color: var(--cyan);
}
body[class^="theme-light-"] .sc, body[class*=" theme-light-"] .sc {
  color: var(--text3);
}
body[class^="theme-light-"] .search-input, body[class*=" theme-light-"] .search-input {
  background: var(--bg3);
  border-color: var(--border2);
}
body[class^="theme-light-"] .search-input:focus, body[class*=" theme-light-"] .search-input:focus {
  background: var(--bg2);
}
body[class^="theme-light-"] .pomo-widget, body[class*=" theme-light-"] .pomo-widget {
  background: var(--bg3);
}
body[class^="theme-light-"] .pomo-preset, body[class*=" theme-light-"] .pomo-preset {
  background: var(--bg2);
}
body[class^="theme-light-"] .pomo-preset.active, body[class*=" theme-light-"] .pomo-preset.active {
  background: var(--cyan-dim);
}
body[class^="theme-light-"] .tc, body[class*=" theme-light-"] .tc {
  background: var(--bg2);
}
body[class^="theme-light-"] .tc:hover, body[class*=" theme-light-"] .tc:hover {
  background: var(--bg3);
}
body[class^="theme-light-"] .tc-notes-indicator, body[class*=" theme-light-"] .tc-notes-indicator {
  color: var(--cyan);
}
body[class^="theme-light-"] .pg-editor-wrap, body[class*=" theme-light-"] .pg-editor-wrap {
  background: var(--bg3);
}
body[class^="theme-light-"] .pg-editor, body[class*=" theme-light-"] .pg-editor {
  color: var(--text);
}
body[class^="theme-light-"] .pg-console-panel, body[class*=" theme-light-"] .pg-console-panel {
  background: var(--bg3);
}
body[class^="theme-light-"] .pg-console-logs, body[class*=" theme-light-"] .pg-console-logs {
  color: var(--text2);
}
body[class^="theme-light-"] .mi-msg.bot .mi-bubble, body[class*=" theme-light-"] .mi-msg.bot .mi-bubble {
  background: var(--bg3);
  color: var(--text);
}
body[class^="theme-light-"] .mi-msg.user .mi-bubble, body[class*=" theme-light-"] .mi-msg.user .mi-bubble {
  background: var(--cyan-dim);
  color: var(--text);
  border-color: var(--border2);
}
body[class^="theme-light-"] .mi-input-textarea, body[class*=" theme-light-"] .mi-input-textarea {
  background: var(--bg2);
}
body[class^="theme-light-"] .mi-grade-box, body[class*=" theme-light-"] .mi-grade-box {
  background: var(--bg3);
}
body[class^="theme-light-"] .kw-pill, body[class*=" theme-light-"] .kw-pill {
  background: var(--bg2);
}
body[class^="theme-light-"] .kw-pill.matched, body[class*=" theme-light-"] .kw-pill.matched {
  background: var(--green-dim);
}
body[class^="theme-light-"] ::-webkit-scrollbar-thumb, body[class*=" theme-light-"] ::-webkit-scrollbar-thumb {
  background: var(--border3);
}

/* ── POMODORO TIMER ── */
.pomo-widget {
  padding: 12px 14px;
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--r8);
  margin: 10px 14px 16px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  position: relative;
}
.pomo-header {
  font-family: var(--fm);
  font-size: 9px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--text2);
  align-self: flex-start;
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: 100%;
}
.pomo-timer-display {
  font-family: var(--fm);
  font-size: 26px;
  font-weight: 700;
  color: var(--cyan);
  letter-spacing: 1.5px;
  margin: 4px 0;
  text-shadow: 0 0 10px var(--cyan-glow);
}
.pomo-controls {
  display: flex;
  gap: 6px;
  width: 100%;
}
.pomo-btn {
  flex: 1;
  padding: 6px 4px;
  border-radius: var(--r6);
  border: 1px solid var(--border2);
  background: transparent;
  color: var(--text);
  font-size: 10px;
  cursor: pointer;
  font-family: var(--fb);
  transition: all 0.15s;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
}
.pomo-btn:hover {
  background: var(--cyan-dim);
  border-color: var(--cyan);
  color: var(--cyan);
}
.pomo-btn.active {
  background: var(--cyan);
  color: var(--bg);
  border-color: var(--cyan);
  font-weight: 600;
}
.pomo-presets {
  display: flex;
  gap: 4px;
  width: 100%;
}
.pomo-preset {
  flex: 1;
  padding: 4px 0;
  font-size: 9.5px;
  font-family: var(--fm);
  border-radius: 4px;
  border: 1px solid transparent;
  background: var(--bg3);
  color: var(--text2);
  cursor: pointer;
  text-align: center;
  transition: all 0.15s;
}
.pomo-preset:hover {
  color: var(--text);
  background: var(--card2);
}
.pomo-preset.active {
  border-color: var(--cyan);
  color: var(--cyan);
  background: var(--cyan-dim);
}
.pomo-topic-title {
  font-size: 10.5px;
  color: var(--text2);
  text-align: center;
  width: 100%;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  border-top: 1px solid var(--border);
  padding-top: 6px;
  margin-top: 2px;
}

/* ── PRACTICE ACCORDION ── */
.qp-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--r8);
  margin-bottom: 8px;
  overflow: hidden;
  transition: all 0.15s ease;
}
.qp-header {
  padding: 12px 14px;
  display: flex;
  align-items: center;
  gap: 10px;
  cursor: pointer;
  user-select: none;
}
.qp-header:hover {
  background: var(--card2);
}
.qp-checkbox {
  width: 18px;
  height: 18px;
  border: 1.5px solid var(--border2);
  border-radius: 5px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  font-size: 11px;
  color: var(--green);
  transition: all 0.15s;
  flex-shrink: 0;
}
.qp-checkbox:hover {
  border-color: var(--green);
  background: var(--green-dim);
}
.qp-checkbox.checked {
  background: var(--green);
  border-color: var(--green);
  color: #fff;
}
.qp-text {
  font-size: 13px;
  color: var(--text);
  line-height: 1.5;
  flex: 1;
}
.qp-checkbox.checked + .qp-text {
  color: var(--text3);
  text-decoration: line-through;
}
.qp-arrow {
  font-size: 10px;
  color: var(--text3);
  transition: transform 0.2s;
  font-family: var(--fm);
}
.qp-card.open .qp-arrow {
  transform: rotate(90deg);
}
.qp-content {
  padding: 0 14px;
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.2s cubic-bezier(0.4, 0, 0.2, 1), padding 0.2s ease;
}
.qp-card.open .qp-content {
  padding: 12px 14px 14px;
  max-height: 400px;
  border-top: 1px solid var(--border);
}
.qp-guide-lbl {
  font-size: 9.5px;
  font-family: var(--fm);
  text-transform: uppercase;
  color: var(--cyan);
  letter-spacing: 1px;
  margin-bottom: 6px;
}
.qp-guide-desc {
  font-size: 12px;
  color: var(--text2);
  line-height: 1.6;
}

/* ── ANALYTICS ── */
.analytics-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 12px;
  margin-bottom: 24px;
}
.ac-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--r10);
  padding: 18px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  position: relative;
  overflow: hidden;
}
.ac-card::after {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 2px;
  background: var(--cyan);
  opacity: 0.7;
}
.ac-title {
  font-family: var(--fm);
  font-size: 9.5px;
  text-transform: uppercase;
  letter-spacing: 1.5px;
  color: var(--text2);
}
.ac-chart-container {
  display: flex;
  align-items: center;
  gap: 14px;
  flex: 1;
}
.ac-chart-pie {
  position: relative;
  width: 60px;
  height: 60px;
  border-radius: 50%;
  background: var(--bg3);
  flex-shrink: 0;
  transition: background 0.3s;
}
.ac-chart-donut {
  position: relative;
  width: 60px;
  height: 60px;
  border-radius: 50%;
  background: var(--bg3);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.ac-chart-donut::after {
  content: '';
  position: absolute;
  width: 46px;
  height: 46px;
  background: var(--card);
  border-radius: 50%;
}
.ac-chart-donut-text {
  position: relative;
  z-index: 2;
  font-family: var(--fm);
  font-size: 11px;
  font-weight: bold;
  color: var(--text);
}
.ac-legend {
  display: flex;
  flex-direction: column;
  gap: 6px;
  font-size: 11px;
  color: var(--text2);
  flex: 1;
}
.ac-legend-item {
  display: flex;
  align-items: center;
  gap: 6px;
}
.ac-legend-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
}
.ac-val {
  font-family: var(--fh);
  font-size: 26px;
  font-weight: bold;
  color: var(--text);
  line-height: 1;
}
.ac-progress-bar {
  height: 5px;
  background: var(--bg3);
  border-radius: 3px;
  overflow: hidden;
  width: 100%;
  margin-top: 4px;
}
.ac-progress-fill {
  height: 100%;
  border-radius: 3px;
  transition: width 0.4s;
  background: var(--cyan);
}

/* ── SORT & FILTER BAR ── */
.sort-select {
  padding: 4px 10px;
  border-radius: 5px;
  border: 1px solid var(--border2);
  background: transparent;
  color: var(--text2);
  font-size: 11px;
  cursor: pointer;
  font-family: var(--fb);
  outline: none;
  transition: all 0.14s;
}
.sort-select:hover {
  background: var(--cyan-dim);
  border-color: var(--cyan);
  color: var(--text);
}

/* ── CODING PLAYGROUND ── */
.pg-container {
  display: flex;
  flex-direction: column;
  gap: 10px;
  animation: fi .15s ease;
  height: 100%;
}
.pg-header-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 11.5px;
  color: var(--text2);
}
.pg-editor-wrap {
  position: relative;
  border: 1px solid var(--border);
  border-radius: var(--r8);
  background: var(--bg3);
  overflow: hidden;
}
.pg-editor {
  width: 100%;
  height: 230px;
  background: transparent;
  border: none;
  color: #e2e8f0;
  font-family: var(--fm);
  font-size: 12.5px;
  line-height: 1.6;
  padding: 12px;
  resize: vertical;
  outline: none;
}
.pg-console-panel {
  border: 1px solid var(--border2);
  border-radius: var(--r8);
  background: #04060a;
  display: flex;
  flex-direction: column;
}
.pg-console-header {
  padding: 8px 12px;
  border-bottom: 1px solid var(--border);
  font-family: var(--fm);
  font-size: 9.5px;
  color: var(--text3);
  letter-spacing: 1px;
  text-transform: uppercase;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.pg-console-logs {
  padding: 10px 12px;
  font-family: var(--fm);
  font-size: 12px;
  line-height: 1.5;
  color: var(--text2);
  max-height: 140px;
  overflow-y: auto;
  min-height: 48px;
  white-space: pre-wrap;
  word-break: break-all;
}
.pg-log-line {
  margin-bottom: 4px;
}
.pg-log-error {
  color: var(--red);
}
.pg-log-info {
  color: var(--cyan);
}
.pg-run-btn {
  padding: 6px 14px;
  border-radius: var(--r6);
  border: 1px solid var(--cyan);
  background: var(--cyan-dim);
  color: var(--cyan);
  font-size: 11.5px;
  font-weight: 600;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  transition: all 0.15s;
  font-family: var(--fb);
}
.pg-run-btn:hover {
  background: var(--cyan);
  color: var(--bg);
  box-shadow: 0 0 12px var(--cyan-glow);
}
.pg-reset-btn {
  padding: 4px 10px;
  border-radius: var(--r6);
  border: 1px solid var(--border2);
  background: transparent;
  color: var(--text2);
  font-size: 10px;
  cursor: pointer;
  transition: all 0.15s;
  font-family: var(--fb);
}
.pg-reset-btn:hover {
  color: var(--text);
  background: var(--card);
}

/* ── STUDY NOTES CENTRAL HUB ── */
.nh-action-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 14px;
  background: var(--card);
  border: 1px solid var(--border);
  padding: 14px 18px;
  border-radius: var(--r10);
  margin-bottom: 20px;
  flex-wrap: wrap;
}
.nh-search-wrap {
  display: flex;
  gap: 8px;
  align-items: center;
  flex: 1;
  max-width: 400px;
}
.nh-grid {
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.nh-subject-section {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--r10);
  padding: 18px;
}
.nh-subject-header {
  font-family: var(--fh);
  font-size: 16px;
  font-weight: 800;
  color: var(--cyan);
  padding-bottom: 8px;
  border-bottom: 1px solid var(--border2);
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.nh-notes-list {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 12px;
}
.nh-note-card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--r8);
  padding: 14px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.nh-note-top {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 10px;
}
.nh-topic-link {
  font-size: 12.5px;
  font-weight: 600;
  color: var(--text);
  text-decoration: none;
  cursor: pointer;
}
.nh-topic-link:hover {
  color: var(--cyan);
  text-decoration: underline;
}
.nh-textarea {
  width: 100%;
  height: 120px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--r6);
  color: var(--text);
  font-family: var(--fb);
  font-size: 12px;
  line-height: 1.5;
  padding: 8px;
  resize: vertical;
  outline: none;
  transition: border-color 0.15s;
}
.nh-textarea:focus {
  border-color: var(--cyan);
}

/* ── MOCK INTERVIEW SIMULATOR ── */
.mi-layout {
  display: grid;
  grid-template-columns: 1fr 340px;
  gap: 18px;
  height: calc(100vh - 120px);
  min-height: 500px;
}
.mi-main-panel {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--r10);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.mi-setup-panel {
  padding: 24px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100%;
  gap: 16px;
  text-align: center;
  max-width: 500px;
  margin: 0 auto;
}
.mi-chat-area {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.mi-msg {
  display: flex;
  gap: 10px;
  max-width: 85%;
  animation: fi 0.2s ease;
}
.mi-msg.bot {
  align-self: flex-start;
}
.mi-msg.user {
  align-self: flex-end;
  flex-direction: row-reverse;
}
.mi-avatar {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: var(--cyan-dim);
  border: 1px solid var(--cyan);
  color: var(--cyan);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--fm);
  font-weight: bold;
  font-size: 12px;
  flex-shrink: 0;
}
.mi-msg.user .mi-avatar {
  background: var(--purple-dim);
  border-color: var(--purple);
  color: var(--purple);
}
.mi-bubble {
  padding: 12px 16px;
  border-radius: 12px;
  font-size: 13px;
  line-height: 1.6;
}
.mi-msg.bot .mi-bubble {
  background: var(--bg3);
  border: 1px solid var(--border);
  color: var(--text);
  border-top-left-radius: 2px;
}
.mi-msg.user .mi-bubble {
  background: var(--cyan-dim);
  border: 1px solid rgba(0, 212, 255, 0.2);
  color: #fff;
  border-top-right-radius: 2px;
}
.mi-input-bar {
  padding: 14px 20px;
  border-top: 1px solid var(--border);
  background: var(--bg2);
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.mi-input-textarea {
  width: 100%;
  height: 70px;
  background: var(--card);
  border: 1px solid var(--border2);
  border-radius: var(--r8);
  color: var(--text);
  font-family: var(--fb);
  font-size: 13px;
  padding: 10px;
  outline: none;
  resize: none;
  transition: border-color 0.15s;
}
.mi-input-textarea:focus {
  border-color: var(--cyan);
}
.mi-btn-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.mi-feedback-panel {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--r10);
  padding: 18px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  overflow-y: auto;
}
.mi-grade-box {
  background: var(--bg2);
  border: 1px solid var(--border2);
  border-radius: var(--r8);
  padding: 12px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  text-align: center;
}
.mi-score {
  font-family: var(--fh);
  font-size: 38px;
  font-weight: 800;
  color: var(--cyan);
  line-height: 1;
  text-shadow: 0 0 10px var(--cyan-glow);
}
.mi-kws {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.kw-pill {
  font-size: 10px;
  font-family: var(--fm);
  padding: 3px 8px;
  border-radius: 4px;
  border: 1px solid var(--border2);
  background: var(--bg3);
  color: var(--text2);
  display: inline-flex;
  align-items: center;
  gap: 4px;
}
.kw-pill.matched {
  background: var(--green-dim);
  border-color: var(--green);
  color: var(--green);
}
.kw-pill.missed {
  opacity: 0.65;
}

/* ── PRINT MEDIA QUERY ── */
@media print {
  body {
    background: #fff !important;
    color: #000 !important;
    height: auto !important;
    overflow: visible !important;
    font-size: 12pt !important;
  }
  header, aside, .dp, .overlay, .nh-action-bar, .open-btn, .theme-select-container, button, select {
    display: none !important;
  }
  .layout, main {
    display: block !important;
    position: static !important;
    padding: 0 !important;
    margin: 0 !important;
    overflow: visible !important;
    height: auto !important;
  }
  .nh-grid {
    gap: 20px !important;
  }
  .nh-subject-section {
    background: #fff !important;
    border: none !important;
    border-bottom: 2px solid #000 !important;
    padding: 0 !important;
    margin-bottom: 20px !important;
    page-break-inside: avoid;
  }
  .nh-subject-header {
    color: #000 !important;
    border-bottom: 2px solid #000 !important;
    font-size: 16pt !important;
  }
  .nh-notes-list {
    display: block !important;
  }
  .nh-note-card {
    background: #fff !important;
    border: 1px solid #ddd !important;
    margin-bottom: 12px !important;
    padding: 10px !important;
    page-break-inside: avoid;
  }
  .nh-topic-link {
    color: #000 !important;
    font-size: 12pt !important;
    font-weight: bold !important;
  }
  .nh-textarea {
    border: none !important;
    background: #fff !important;
    color: #333 !important;
    font-size: 11pt !important;

        questions:['What is the difference between paging and segmentation?','How does virtual memory allow programs bigger than RAM?','What is a TLB miss? What happens then?','Explain the page replacement algorithms and their trade-offs.','What is thrashing? How does the OS detect and handle it?','What is the difference between internal and external fragmentation?','What is Belady\'s anomaly in FIFO page replacement?'],
        resources:[
          {name:'Neso Academy Memory Management',type:'YouTube',url:'https://www.youtube.com/playlist?list=PLBlnK6fEyqRiVhbXDGLXDk_OQAeuVcp2O',ico:'▶'},
          {name:'OSTEP Memory Chapters',type:'Book',url:'https://pages.cs.wisc.edu/~remzi/OSTEP/',ico:'📘'},
          {name:'GFG Virtual Memory',type:'Article',url:'https://www.geeksforgeeks.org/virtual-memory-in-operating-system/',ico:'📄'},
        ]},
       {id:'t_dead',name:'Deadlocks',diff:'medium',hrs:5,
        tags:['Coffman Conditions','Banker\'s Algorithm','Detection'],
        about:'Deadlock is a state where processes wait on each other forever. The four Coffman conditions must all hold simultaneously. Prevention, avoidance, detection, recovery — know all four strategies.',
        concepts:['4 Coffman Conditions: Mutual Exclusion, Hold & Wait, No Preemption, Circular Wait','Resource Allocation Graph — detect cycle for single instance','Banker\'s Algorithm — safe state check for avoidance','Deadlock Prevention — negate one Coffman condition','Deadlock Detection — run Banker\'s for multi-instance resources','Deadlock Recovery — process termination or resource preemption','Livelock vs Deadlock — processes active but making no progress'],
        questions:['State and explain the four Coffman conditions for deadlock.','What is a Resource Allocation Graph? How to detect deadlock?','Explain Banker\'s Algorithm with example.','What is the difference between deadlock prevention and avoidance?','How is livelock different from deadlock?','Give a real-world example of deadlock in a database.','How does the OS recover from a detected deadlock?'],
        resources:[
          {name:'Neso Academy Deadlocks',type:'YouTube',url:'https://www.youtube.com/playlist?list=PLBlnK6fEyqRiVhbXDGLXDk_OQAeuVcp2O',ico:'▶'},
          {name:'GFG Deadlock',type:'Article',url:'https://www.geeksforgeeks.org/introduction-of-deadlock-in-operating-system/',ico:'📄'},
          {name:'Gate Smashers Deadlock',type:'YouTube',url:'https://www.youtube.com/playlist?list=PLxCzCOWd7aiGz9donHRrE9I3Mwn6XdP8p',ico:'▶'},
        ]},
       {id:'t_fs',name:'File Systems',diff:'medium',hrs:5,
        tags:['Inode','Block','Journaling'],
        about:'File systems organize data on disk. The inode structure, directory traversal, and journaling for crash recovery are all tested in system design and OS interviews.',
        concepts:['Inode — metadata block (size, permissions, block pointers, NOT name)','Hard link vs Soft link — same inode vs new inode pointing to path','Directory — special file mapping names to inodes','Block allocation — contiguous, linked, indexed (inode)','Journaling — write-ahead log for crash consistency','File system hierarchy — VFS layer in Linux abstracts FS types','Disk scheduling — FCFS, SSTF, SCAN, C-SCAN algorithms'],
        questions:['What is an inode? What information does it store?','Difference between hard link and soft (symbolic) link.','What is journaling in a file system and why is it needed?','How does the OS locate a file given its path?','What happens when you delete a file — is data immediately gone?','What is the difference between FAT, ext4, and NTFS?','Explain disk scheduling algorithms — which does Linux use?'],
        resources:[
          {name:'OSTEP File System Chapters',type:'Book',url:'https://pages.cs.wisc.edu/~remzi/OSTEP/file-intro.pdf',ico:'📘'},
          {name:'GFG File Systems',type:'Article',url:'https://www.geeksforgeeks.org/file-systems-in-operating-system/',ico:'📄'},

    {id:'dbms',ico:'◫',lbl:'DBMS',title:'Database Management Systems',
     desc:'SQL is tested in nearly every interview. Deep DBMS concepts (ACID, indexing, transactions) are asked at all top product companies.',
     hrs:35,
     topics:[
       {id:'t_sql',name:'SQL — Joins, Window Functions, CTEs',diff:'easy',hrs:8,
        tags:['INNER JOIN','Window Fn','CTE','GROUP BY'],
        about:'SQL is non-negotiable. Every product company tests SQL in interviews or take-home assignments. Window functions and CTEs are the differentiators — most candidates skip them.',
        concepts:['INNER, LEFT, RIGHT, FULL OUTER, CROSS, SELF JOIN with Venn logic','GROUP BY + HAVING vs WHERE — filter before vs after grouping','Subqueries — correlated vs non-correlated','CTE (WITH clause) — named temporary result set, readable recursive queries','Window functions: ROW_NUMBER(), RANK(), DENSE_RANK(), NTILE()','Aggregate windows: SUM() OVER(), AVG() OVER(), LAG(), LEAD()','PARTITION BY vs GROUP BY — windows don\'t collapse rows'],
        questions:['Write SQL to find the 2nd highest salary.','Find departments with average salary > overall average.','Get top 3 salaries per department using window functions.','Find duplicate records in a table.','Write a query to find customers who placed orders in all months.','Calculate running total using window function.','Find employees who earn more than their manager.','Write a recursive CTE to traverse an employee hierarchy.'],
        resources:[
          {name:'SQLZoo — Interactive SQL (free)',type:'Practice',url:'https://sqlzoo.net/',ico:'◈'},
          {name:'Mode Analytics SQL Tutorial',type:'Tutorial',url:'https://mode.com/sql-tutorial/',ico:'📄'},
          {name:'LeetCode SQL Problems',type:'Practice',url:'https://leetcode.com/problemset/database/',ico:'◈'},
          {name:'StrataScratch SQL Problems',type:'Practice',url:'https://www.stratascratch.com/',ico:'◈'},
        ]},
       {id:'t_norm',name:'Normalization — 1NF to BCNF',diff:'medium',hrs:5,
        tags:['1NF','2NF','3NF','BCNF'],
        about:'Normalization eliminates data redundancy and anomalies. Know how to identify functional dependencies and normalize any schema up to BCNF — this is standard interview material.',
        concepts:['1NF — atomic values, no repeating groups','2NF — 1NF + no partial dependencies (remove if key is composite)','3NF — 2NF + no transitive dependencies (A→B→C becomes two tables)','BCNF — every determinant must be a candidate key (stricter 3NF)','Denormalization — intentional redundancy for read performance','Functional Dependency: A → B means A uniquely determines B','Armstrong\'s Axioms — reflexivity, augmentation, transitivity'],
        questions:['What is normalization and why is it needed?','What are update, insert, and delete anomalies?','Convert a given unnormalized table to 3NF step by step.','What is the difference between 3NF and BCNF?','When would you denormalize a table?','What is a functional dependency? Give examples.','Find all candidate keys for a given relation with FDs.'],
        resources:[
          {name:'GFG Normalization',type:'Article',url:'https://www.geeksforgeeks.org/introduction-of-database-normalization/',ico:'📄'},
          {name:'Gate Smashers DBMS Normalization',type:'YouTube',url:'https://www.youtube.com/playlist?list=PLxCzCOWd7aiFAN6I8CuViBuCdJgiOkT2Y',ico:'▶'},
          {name:'Neso Academy DBMS',type:'YouTube',url:'https://www.youtube.com/playlist?list=PLBlnK6fEyqRi_CUQ-FTxgZJ19gMsgyAx6',ico:'▶'},
        ]},
       {id:'t_txn',name:'Transactions, ACID & Isolation Levels',diff:'medium',hrs:5,
        tags:['ACID','Isolation','Dirty Read','Phantom Read'],
        about:'Transactions ensure data integrity. ACID properties and isolation levels are asked in every senior backend interview. Know the anomalies each isolation level prevents.',
        concepts:['Atomicity — all or nothing (rollback on failure)','Consistency — DB moves from valid state to valid state','Isolation — concurrent transactions don\'t interfere','Durability — committed data survives crashes (WAL/journal)','Isolation Levels (weakest to strongest): Read Uncommitted → Read Committed → Repeatable Read → Serializable','Dirty Read — read uncommitted data from another transaction','Non-repeatable Read — same row, different value on re-read','Phantom Read — new rows appear between reads'],
        questions:['Explain ACID properties with real examples.','What is a dirty read? Which isolation level prevents it?','What is the difference between Repeatable Read and Serializable?','How do databases implement serializable isolation (2PL, MVCC)?','What happens when two transactions deadlock in a database?','Explain optimistic vs pessimistic locking.','What is MVCC (Multi-Version Concurrency Control)?'],
        resources:[
          {name:'DDIA Chapter 7 — Transactions (must read)',type:'Book',url:'https://dataintensive.net/',ico:'📘'},
          {name:'Gate Smashers DBMS Transactions',type:'YouTube',url:'https://www.youtube.com/playlist?list=PLxCzCOWd7aiFAN6I8CuViBuCdJgiOkT2Y',ico:'▶'},
          {name:'Martin Kleppmann Blog',type:'Article',url:'https://martin.kleppmann.com/',ico:'📄'},
        ]},
       {id:'t_idx',name:'Indexing — B+ Trees, Query Optimization',diff:'medium',hrs:6,
        tags:['B+ Tree','Clustered Index','Query Plan','EXPLAIN'],
        about:'Indexing is the single biggest factor in database performance. Understanding B+ tree structure, clustered vs non-clustered, and EXPLAIN plans separates senior engineers from juniors.',
        concepts:['B+ Tree — balanced, all data in leaf nodes, linked leaves for range scan','Clustered Index — data physically sorted by index key (one per table)','Non-clustered Index — separate structure pointing to data rows','Composite Index — column order matters (leftmost prefix rule)','Covering Index — query satisfied entirely from index, no table lookup','Index Selectivity — how many distinct values (high = better index)','EXPLAIN / Query Plan — seq scan vs index scan vs index-only scan','When NOT to index — small tables, write-heavy columns, low selectivity'],
        questions:['Why is B+ tree preferred over B tree for database indexing?','What is the difference between clustered and non-clustered index?','How does a composite index (a, b, c) help queries on (a), (a,b), (a,b,c)?','What is a covering index and why is it fast?','When would adding an index slow down your database?','How do you read a PostgreSQL EXPLAIN ANALYZE output?','What is index selectivity? Why does it matter?'],
        resources:[
          {name:'Use The Index, Luke! (free, best resource)',type:'Tutorial',url:'https://use-the-index-luke.com/',ico:'📄'},
          {name:'Gate Smashers Indexing',type:'YouTube',url:'https://www.youtube.com/playlist?list=PLxCzCOWd7aiFAN6I8CuViBuCdJgiOkT2Y',ico:'▶'},
          {name:'Postgres EXPLAIN docs',type:'Docs',url:'https://www.postgresql.org/docs/current/using-explain.html',ico:'📄'},
        ]},
       {id:'t_nosql',name:'NoSQL — MongoDB, Redis, Cassandra',diff:'easy',hrs:5,
        tags:['Document DB','Key-Value','Wide Column','CAP'],
        about:'NoSQL databases solve specific scale problems that relational DBs struggle with. Know when to use which type — this is a system design interview staple.',
        concepts:['NoSQL types: Document (MongoDB), Key-Value (Redis), Wide Column (Cassandra), Graph (Neo4j)','When NoSQL over SQL: unstructured data, horizontal scaling, flexible schema','MongoDB — BSON documents, collections, aggregation pipeline, replica sets','Redis — in-memory, persistence with RDB/AOF, data types (String/List/Set/Hash/ZSet)','Cassandra — masterless ring, consistent hashing, tunable consistency (quorum)','BASE vs ACID — Basically Available, Soft state, Eventually consistent','CAP Theorem — only 2 of 3: CP (Cassandra), AP (DynamoDB), CA (single node SQL)'],
        questions:['When would you use MongoDB over PostgreSQL?','What data types does Redis support? Use case for each?','What is eventual consistency in Cassandra?','Explain CAP theorem with examples of each combination.','How does Cassandra achieve high write throughput?','When would you use Redis as a cache vs as a primary DB?','How does MongoDB handle transactions? (since v4.0)'],
        resources:[
          {name:'MongoDB University (free)',type:'Course',url:'https://learn.mongodb.com/',ico:'📘'},
          {name:'Redis.io Documentation',type:'Docs',url:'https://redis.io/docs/',ico:'📄'},
          {name:'Cassandra Data Modeling',type:'Tutorial',url:'https://www.datastax.com/learn/data-modeling-by-example',ico:'📄'},
        ]},
     ]},
    {id:'cn',ico:'⬡',lbl:'Networks',title:'Computer Networks',
     desc:'Fundamental for backend, DevOps, and system design interviews. HTTP, TCP/IP, DNS — you must know these cold.',
     hrs:30,
     topics:[
       {id:'t_http',name:'HTTP/HTTPS & REST',diff:'easy',hrs:4,
        tags:['REST','Status Codes','Headers','HTTPS/TLS'],
        about:'HTTP is the language of the web. Every API you build uses it. Know status codes, methods, headers, and TLS handshake for interviews. REST principles are asked in system design.',
        concepts:['HTTP Methods: GET (safe+idempotent), POST, PUT (idempotent), PATCH, DELETE','Status codes: 1xx informational, 2xx success, 3xx redirect, 4xx client error, 5xx server error','Important headers: Content-Type, Authorization, Cache-Control, CORS headers','HTTPS = HTTP + TLS — symmetric key exchange using asymmetric crypto (handshake)','TLS 1.3 handshake — client hello, server hello, key exchange, finished','HTTP/2 — multiplexing (no head-of-line), header compression (HPACK), server push','HTTP/3 — QUIC over UDP, 0-RTT connection, better mobile performance','REST constraints: stateless, uniform interface, client-server, cacheable, layered'],
        questions:['What is the difference between GET and POST?','What does 401 mean vs 403? When to use each?','Explain the HTTPS TLS handshake step by step.','What is CORS? How does it work? What is a preflight request?','Difference between HTTP/1.1, HTTP/2, and HTTP/3.','What makes an API truly RESTful?','How does session management work? Cookie vs JWT?','What is idempotency? Why does it matter for retries?'],

          {name:'Cloudflare Learning Center',type:'Tutorial',url:'https://www.cloudflare.com/learning/',ico:'📄'},
          {name:'Fireship HTTP in 100s',type:'YouTube',url:'https://www.youtube.com/watch?v=iYM2zFP3Zn0',ico:'▶'},
        ]},
       {id:'t_tcp',name:'TCP vs UDP & Networking',diff:'medium',hrs:5,
        tags:['3-Way Handshake','Flow Control','Congestion Control'],
        about:'TCP and UDP are the transport layer protocols. Understanding when to use each and how TCP guarantees delivery is fundamental to system design and backend engineering interviews.',
        concepts:['TCP — connection-oriented, reliable, ordered, flow/congestion control','UDP — connectionless, best-effort, faster (DNS, video streaming, gaming)','TCP 3-way handshake: SYN → SYN-ACK → ACK','TCP 4-way termination: FIN → ACK → FIN → ACK','Sliding window — flow control, window size = receiver buffer','Congestion control — slow start, AIMD, fast retransmit, fast recovery','Sequence numbers — detect loss, reorder, de-duplicate','TIME_WAIT state — ensures last ACK delivered, prevents old packets'],
        questions:['Explain TCP 3-way handshake. What if SYN is lost?','What is the difference between TCP flow control and congestion control?','Why use UDP for video streaming instead of TCP?','What is TCP slow start?','What happens in TCP TIME_WAIT state?','How does TCP detect packet loss and retransmit?','What is head-of-line blocking in HTTP/1.1?','Explain the difference between connection-oriented and connectionless protocols.'],
        resources:[

          {name:'Neso Academy Computer Networks',type:'YouTube',url:'https://www.youtube.com/playlist?list=PLBlnK6fEyqRgMCUAG0XRw78UA8qnv6jEx',ico:'▶'},
          {name:'Julia Evans Networking Zine',type:'Article',url:'https://jvns.ca/networking-zine.pdf',ico:'📄'},
        ]},
       {id:'t_dns',name:'DNS, CDN & How Internet Works',diff:'easy',hrs:3,
        tags:['Recursive Resolver','CDN','Anycast','TTL'],
        about:'Understanding DNS is crucial for system design. Every engineer should know what happens when you type google.com — this question is asked verbatim in interviews.',
        concepts:['DNS hierarchy: Root NS → TLD NS (.com) → Authoritative NS → Record','DNS record types: A (IPv4), AAAA (IPv6), CNAME (alias), MX (mail), TXT (verification)','Recursive resolver vs Iterative resolver','TTL — Time to Live, how long to cache a DNS record','CDN — cache static assets close to users, reduce latency by 60-80%','Anycast — same IP, different servers, route to nearest geographically','DNS over HTTPS (DoH) and DNS over TLS (DoT) for privacy'],
        questions:['What happens step by step when you type www.google.com?','What is the difference between a recursive and iterative DNS query?','What is a CDN and how does it reduce latency?','What is Anycast routing and how is it used?','What DNS record would you use for an alias?','What is TTL and what happens if you set it too low/high?','How does a browser use DNS caching?'],

          {name:'How DNS Works (comic)',type:'Article',url:'https://howdns.works/',ico:'📄'},
          {name:'ByteByteGo DNS Deep Dive',type:'YouTube',url:'https://www.youtube.com/watch?v=27r4Bzuj5NQ',ico:'▶'},

       {id:'t_ip',name:'IP, Subnetting & Routing',diff:'medium',hrs:5,
        tags:['CIDR','Subnet Mask','ARP','BGP'],
        about:'Every cloud engineer and backend engineer working with VPCs, load balancers, and security groups must understand IP addressing and subnetting cold.',
        concepts:['IPv4 — 32-bit, classes A/B/C/D/E, private ranges (10.x, 172.16.x, 192.168.x)','IPv6 — 128-bit, solves exhaustion, no NAT needed','CIDR notation — 192.168.1.0/24 means 24-bit network, 8-bit host (256 addresses)','Subnet mask — network bits 1s, host bits 0s','ARP — maps IP to MAC address within LAN','Routing — routers use routing tables, longest prefix match wins','BGP — exterior gateway protocol between ISPs/ASes','NAT — Network Address Translation, maps private to public IP (MASQUERADE)'],
        questions:['How many hosts can /24 subnet support?','What is the difference between a router and a switch?','What is ARP and when is it used?','What is NAT and why was it introduced?','How does BGP prevent routing loops?','Calculate the broadcast address for 192.168.10.0/27.','What is the difference between static and dynamic routing?'],

          {name:'Cisco Subnetting Practice',type:'Practice',url:'https://subnettingpractice.com/',ico:'◈'},

    {id:'sysdes',ico:'◳',lbl:'System Design',title:'System Design',
     desc:'The highest-weighted round at 20 LPA companies. A bad system design round can kill an otherwise great interview. Start preparing early.',
     hrs:55,
     topics:[
       {id:'t_sd_found',name:'System Design Fundamentals',diff:'medium',hrs:8,
        tags:['Scalability','Availability','Load Balancer','CAP'],
        about:'You must master the building blocks before designing any system. These are the vocabulary and concepts you will use in every design interview.',
        concepts:['Vertical scaling (bigger machine) vs Horizontal scaling (more machines)','Load Balancer — L4 (TCP) vs L7 (HTTP), Round Robin, Least Connections, IP Hash','Availability = Uptime/(Uptime+Downtime), 99.99% = 52 min/year downtime','Latency vs Throughput — response time vs requests per second','Caching — cache-aside, write-through, write-back, write-around patterns','CDN — static assets, edge caching, Anycast routing','Rate Limiting — token bucket vs leaky bucket algorithms','SQL vs NoSQL — structure vs scale, ACID vs BASE'],
        questions:['How would you handle 10x traffic spike suddenly?','Design a rate limiter for an API — what algorithm and where to store state?','Explain cache-aside vs write-through caching. When to use each?','What is the difference between latency and throughput?','How does a load balancer decide where to send a request?','What is a CDN and when would you NOT use one?','Explain the difference between 99.9% and 99.99% availability.'],
        resources:[
          {name:'System Design Primer (GitHub)',type:'Article',url:'https://github.com/donnemartin/system-design-primer',ico:'📄'},
          {name:'ByteByteGo YouTube (free)',type:'YouTube',url:'https://www.youtube.com/@ByteByteGo',ico:'▶'},
          {name:'Gaurav Sen System Design',type:'YouTube',url:'https://www.youtube.com/@GauravSensei',ico:'▶'},
          {name:'Designing Data-Intensive Applications (DDIA)',type:'Book',url:'https://dataintensive.net/',ico:'📘'},
        ]},
       {id:'t_sd_cache',name:'Caching & Message Queues',diff:'medium',hrs:8,
        tags:['Redis','Kafka','Cache Eviction','Pub/Sub'],
        about:'Caching and async messaging are the two most common scalability tools. Redis and Kafka appear in almost every system design interview.',
        concepts:['Redis data structures: String, List, Set, Sorted Set, Hash — use cases for each','Cache eviction: LRU, LFU, FIFO, TTL-based expiry','Cache stampede — many requests miss cache simultaneously, use probabilistic early expiry','Message Queue benefits: decoupling, async processing, buffer spikes, retry','Kafka — distributed log, partitions, consumer groups, offset management','At-least-once vs At-most-once vs Exactly-once delivery semantics','Dead Letter Queue (DLQ) — handle messages that repeatedly fail processing'],
        questions:['Design an LRU Cache — HashMap + Doubly Linked List O(1)','When would you use Redis Sorted Set? Give a use case.','What is cache stampede? How do you prevent it?','Explain Kafka partitions and consumer groups. What is ordering guarantee?','When would you use a message queue vs direct API calls?','How do you ensure exactly-once processing in Kafka?','What is the difference between Redis pub/sub and Kafka?'],
        resources:[
          {name:'Redis Official Documentation',type:'Docs',url:'https://redis.io/docs/',ico:'📄'},
          {name:'Confluent Kafka Tutorial (free)',type:'Tutorial',url:'https://developer.confluent.io/learn-kafka/',ico:'📄'},
          {name:'ByteByteGo Caching',type:'YouTube',url:'https://www.youtube.com/watch?v=dGAgxozNWFE',ico:'▶'},
        ]},
       {id:'t_sd1',name:'Design: URL Shortener (Starter)',diff:'medium',hrs:3,
        tags:['Base62','Hashing','Redirection','Analytics'],
        about:'The hello-world of system design. Always start here. Covers core concepts: ID generation, encoding, storage, redirection, and analytics. Perfect to practice the interview framework.',
        concepts:['Requirements: shorten URL, redirect, analytics, custom alias, expiry','Scale: 100M URLs/day write, 10B reads/day, 100:1 read:write ratio','ID generation: Auto-increment vs MD5 vs Base62 encoding (6 chars = 62^6 = 56B unique)','Hash collision handling: check DB, regenerate','Storage: SQL (URL mapping) + Redis (hot URL cache), Cassandra for analytics','Redirection: 301 (permanent, cached) vs 302 (temporary, always hits server)','Analytics: Kafka event stream → Spark → analytics DB'],
        questions:['How would you generate unique short codes at scale?','What is Base62 encoding? Why not MD5 directly?','Should the redirect be 301 or 302? Tradeoffs?','How would you store 100B URLs? What database?','How do you handle a custom alias that\'s already taken?','How would you count clicks accurately at scale?','How do you handle expiration of short URLs?'],

          {name:'Gaurav Sen URL Shortener',type:'YouTube',url:'https://www.youtube.com/@GauravSensei',ico:'▶'},
        ]},
       {id:'t_sd2',name:'Design: WhatsApp / Chat System',diff:'medium',hrs:4,
        tags:['WebSocket','Presence','E2E Encryption','Message Storage'],
        about:'Chat systems test real-time communication, message delivery guarantees, and offline handling. WebSockets, connection management, and message ordering are key focus areas.',
        concepts:['WebSocket — full-duplex over single TCP connection, persistent','Chat service architecture: client → load balancer → chat servers (WebSocket)','Message delivery: at-least-once with de-duplication using client-generated UUID','Online presence: heartbeat every 5s, Redis TTL for presence state','Message ordering: sequence IDs per conversation, Snowflake-style IDs','Push notifications for offline users: APNs/FCM integration','End-to-end encryption: Signal protocol, key exchange (X3DH), no server decryption','Message storage: Cassandra (write-heavy, time-series, per-chat partition key)'],
        questions:['How would you maintain persistent WebSocket connections at scale?','How do you ensure messages are delivered in order?','How do you handle messages sent when the recipient is offline?','How would you implement read receipts (single tick, double tick, blue tick)?','How does end-to-end encryption work in WhatsApp?','How would you store group chat messages with 1000 members?','How do you scale to 1 billion concurrent users?'],
        resources:[
          {name:'ByteByteGo WhatsApp Design',type:'YouTube',url:'https://www.youtube.com/watch?v=vvhC64hQZMk',ico:'▶'},
          {name:'Gaurav Sen Chat System',type:'YouTube',url:'https://www.youtube.com/@GauravSensei',ico:'▶'},
          {name:'High Scalability WhatsApp',type:'Article',url:'http://highscalability.com/blog/2014/2/26/the-whatsapp-architecture-facebook-bought-for-19-billion.html',ico:'📄'},
        ]},
       {id:'t_sd3',name:'Design: Twitter / News Feed',diff:'hard',hrs:5,
        tags:['Fan-out','Timeline','Celebrity Problem','Ranking'],
        about:'News feed design is one of the most common hard system design questions. The fan-out problem (should you push or pull?) and handling celebrity accounts are key differentiators.',
        concepts:['Fan-out on write (push) — pre-compute feed on tweet, fast read, slow write','Fan-out on read (pull) — compute feed on load, slow read, fast write','Hybrid — push for regular users, pull for celebrities (follows-based threshold)','Feed ranking: engagement prediction model, recency, EdgeRank/graph signals','Timeline storage: Redis sorted set (score = timestamp) for hot feeds','Infinite scroll pagination: cursor-based not page number (avoid duplicates)','Media: object storage (S3), CDN for images/videos, transcoding pipeline'],
        questions:['Explain fan-out on write vs fan-out on read. Which does Twitter use?','How do you handle a celebrity with 100M followers tweeting?','How would you rank tweets in a personalized feed?','How do you implement infinite scroll efficiently?','How does Twitter shard its database?','How would you implement trending hashtags in real-time?','How do you store and serve profile images at scale?'],
        resources:[
          {name:'ByteByteGo Twitter Design',type:'YouTube',url:'https://www.youtube.com/watch?v=wYk0xPP_P_8',ico:'▶'},

       {id:'t_sd4',name:'Design: Uber / Ride Sharing',diff:'hard',hrs:4,
        tags:['Geospatial','Matching','Surge Pricing','Real-time Tracking'],
        about:'Uber-style design tests geospatial indexing, real-time matching, and supply-demand balancing. QuadTree and Google S2 are key concepts.',
        concepts:['Driver location updates: 4-5 updates/second per driver, write-heavy','Geospatial indexing: QuadTree or Google S2 cells for nearby search','Matching algorithm: find drivers within radius, sort by ETA, assign','Supply-demand balancing: surge pricing = Poisson process multiplier','Real-time tracking: WebSocket from driver → update location store → push to rider','Trip DB: PostgreSQL for ACID trips, Cassandra for location history','Consistent hashing to shard drivers by city/region'],
        questions:['How do you efficiently find drivers near a user\'s location?','What is a QuadTree? How does it help with geospatial queries?','How would you implement surge pricing?','How do you push driver location to the rider in real-time?','How do you handle the matching when no drivers are nearby?','How would you prevent the same driver from being matched to multiple riders?','How do you partition the database by geography?'],

       {id:'t_sd5',name:'Design: Netflix / Video Streaming',diff:'hard',hrs:5,

        concepts:['Video ingestion: upload → transcode to multiple resolutions (240p to 4K) → H.264/H.265','Adaptive Bitrate Streaming (ABR): HLS/DASH — segment video, switch quality dynamically','CDN strategy: Netflix Open Connect (proprietary CDN), ISP-collocated servers','Chunked upload: multipart upload to S3, resume on failure','Content discovery: hybrid recommendation (collaborative + content-based filtering)','Search: Elasticsearch for title/metadata search, Kafka for real-time indexing','Database: MySQL for user data, Cassandra for viewing history, DynamoDB for session'],
        questions:['How does Netflix handle 15% of global internet traffic?','What is adaptive bitrate streaming? How does the client decide quality?','How would you design the video transcoding pipeline?','How does Netflix\'s CDN (Open Connect) work?','How does Netflix recommend content to users?','How do you handle video playback resumption?','How would you design the upload pipeline for creators on YouTube?'],

    {id:'oop',ico:'◎',lbl:'OOP & LLD',title:'OOP & Low Level Design',
     desc:'Design patterns and OOP concepts are tested in dedicated LLD rounds at companies like Google, Amazon, Flipkart, Swiggy, and all top startups.',
     hrs:40,
     topics:[
       {id:'t_solid',name:'SOLID Principles',diff:'medium',hrs:5,
        tags:['SRP','OCP','LSP','ISP','DIP'],
        about:'SOLID is the foundation of maintainable object-oriented code. Every senior interview includes at least one SOLID question. Know each principle, its violation, and the fix.',
        concepts:['S — Single Responsibility: one class, one reason to change','O — Open/Closed: open for extension, closed for modification (use inheritance/interfaces)','L — Liskov Substitution: subclass should be usable where parent is expected','I — Interface Segregation: don\'t force clients to implement methods they don\'t use','D — Dependency Inversion: depend on abstractions, not concretions (inject dependencies)','God Class — violates SRP, too many responsibilities','SOLID violations lead to: rigid, fragile, immobile, viscous code'],
        questions:['Explain SOLID with one real code example for each.','What happens if you violate Liskov Substitution Principle?','How does Dependency Injection relate to Dependency Inversion?','Refactor this God Class to follow SRP.','How does the Open/Closed Principle relate to design patterns like Strategy?','What is the difference between ISP and SRP?'],
        resources:[
          {name:'Refactoring Guru — SOLID',type:'Article',url:'https://refactoring.guru/solid',ico:'📄'},
          {name:'Arjan Codes SOLID YouTube',type:'YouTube',url:'https://www.youtube.com/@ArjanCodes',ico:'▶'},
          {name:'Baeldung SOLID Java',type:'Article',url:'https://www.baeldung.com/solid-principles',ico:'📄'},
        ]},
       {id:'t_patterns',name:'Design Patterns — Gang of Four',diff:'medium',hrs:12,
        tags:['Singleton','Factory','Observer','Strategy'],
        about:'Design patterns are reusable solutions to common design problems. The Gang of Four (GoF) 23 patterns split into Creational, Structural, and Behavioral. Know 10-12 core patterns deeply.',
        concepts:['Creational — Singleton (one instance), Factory (decouple creation), Builder (step-by-step), Abstract Factory','Structural — Adapter (interface conversion), Decorator (add behavior), Facade (simplify complex system), Proxy (control access)','Behavioral — Observer (event subscription), Strategy (interchangeable algorithms), Command (encapsulate action), Iterator','Singleton thread-safety: double-checked locking with volatile keyword','Factory Method vs Abstract Factory — one product vs families of products','Observer = Publisher/Subscriber — Java EventListener, JS addEventListener'],
        questions:['Implement thread-safe Singleton in Java/Python.','When would you use Factory Method vs Abstract Factory?','Implement Observer pattern — use case: event notification system.','What problem does the Strategy pattern solve? Give example.','How is Decorator different from Inheritance?','How does the Proxy pattern work? Give a real use case.','What design pattern does Java\'s InputStream use?','Implement Builder pattern for creating a User object.'],
        resources:[
          {name:'Refactoring Guru — Design Patterns (free)',type:'Tutorial',url:'https://refactoring.guru/design-patterns',ico:'📄'},
          {name:'Christopher Okhravi YouTube',type:'YouTube',url:'https://www.youtube.com/@ChristopherOkhravi',ico:'▶'},
          {name:'Head First Design Patterns (book)',type:'Book',url:'https://www.oreilly.com/library/view/head-first-design/0596007124/',ico:'📘'},
        ]},
       {id:'t_lld',name:'LLD Problems — Parking Lot, Chess, Bookmyshow',diff:'hard',hrs:15,
        tags:['Class Diagram','UML','Extensibility','OOP'],
        about:'LLD interviews ask you to design a small system using OOP principles. You\'ll draw classes, define interfaces, and write code. Framework: identify actors → define objects → apply SOLID → code.',
        concepts:['LLD framework: Requirements → Entities → Class Diagram → Interfaces → Implementation','Parking Lot: Vehicle hierarchy, Spot types, ParkingFloor, Ticket, PricingStrategy (Strategy pattern)','BookMyShow: Show, Theater, Screen, Seat, Booking, Payment (State pattern for booking flow)','Chess: Board, Piece hierarchy (King/Queen/Pawn), Move validation, Game state','Library Management: Book, Member, LibraryCard, FineCalculator, Reservation queue','ATM: Card, Account, Transaction, ATMState (Vending/Processing/Dispensing)','Always ask: What changes? Program to that interface.'],
        questions:['Design a parking lot system — classes, interfaces, and relationships.','Design BookMyShow seat booking with concurrency — how to prevent double booking?','Design a library management system.','Design an ATM system using state machine.','Design a chess game — focus on move validation.','How would you add a new vehicle type to parking lot without changing existing code?','Design an elevator system for a 10-floor building.'],
        resources:[
          {name:'Gaurav Sen LLD Playlist',type:'YouTube',url:'https://www.youtube.com/@GauravSensei',ico:'▶'},
          {name:'Ashish Pratap Singh LLD',type:'YouTube',url:'https://www.youtube.com/@ashishps_1',ico:'▶'},
          {name:'Udit Agarwal LLD',type:'YouTube',url:'https://www.youtube.com/@UditAgarwal21',ico:'▶'},
        ]},
     ]},
  ]},
  {cat:'LAYER 2 — CORE TRACK',color:'#a78bfa',lc:'l2',subjects:[
    {id:'genai',ico:'✦',lbl:'GenAI/LLM',title:'GenAI & LLM Engineering',
     desc:'The single hottest skill for 2026-28. Companies pay 22-45 LPA. Build real AI apps on top of LLMs — RAG pipelines, agents, and production deployments.',
     hrs:60,
     topics:[
       {id:'t_prompt',name:'Prompt Engineering',diff:'easy',hrs:5,
        tags:['Few-shot','Chain of Thought','System Prompt','Structured Output'],
        about:'Prompt engineering is the fastest way to get value from LLMs. Master these techniques and you can dramatically improve model output quality for any task.',
        concepts:['Zero-shot — no examples, direct instruction','Few-shot — 2-5 examples in prompt to guide output format','Chain-of-Thought (CoT) — add "think step by step" for reasoning tasks','System prompt vs User message — global instructions vs per-request','Temperature — 0 for deterministic facts, 0.7-1.0 for creative tasks','Structured output — JSON mode, function calling, pydantic schemas','Prompt injection — malicious input overrides system prompt (security risk)','Constitutional AI — self-critique and revision pattern'],
        questions:['What is the difference between few-shot and zero-shot prompting?','How does Chain-of-Thought improve reasoning tasks?','When would you set temperature to 0 vs 1?','How do you prevent prompt injection attacks?','How do you get an LLM to always output valid JSON?','What is the role of the system prompt?','How would you test if your prompt is robust?'],
        resources:[
          {name:'Anthropic Prompt Engineering Docs',type:'Docs',url:'https://docs.anthropic.com/en/docs/build-with-claude/prompt-engineering/overview',ico:'📄'},
          {name:'DeepLearning.AI Prompting Course (free)',type:'Course',url:'https://www.deeplearning.ai/short-courses/chatgpt-prompt-engineering-for-developers/',ico:'📘'},
          {name:'OpenAI Prompt Engineering Guide',type:'Docs',url:'https://platform.openai.com/docs/guides/prompt-engineering',ico:'📄'},

       {id:'t_rag',name:'RAG — Retrieval Augmented Generation',diff:'medium',hrs:10,
        tags:['Chunking','Embedding','Vector DB','Reranking'],
        about:'RAG lets LLMs answer questions from your own documents. It\'s the most deployed GenAI pattern in production. Every AI engineering role tests RAG deeply.',
        concepts:['RAG pipeline: Document → Chunk → Embed → Store → Query → Retrieve → Augment → Generate','Chunking strategies: fixed-size, sentence, semantic, recursive character','Embedding models: text-embedding-3-small (OpenAI), all-MiniLM (local), BGE','Similarity search: cosine similarity, dot product, euclidean distance','Reranking: cross-encoder (Cohere Rerank) reorders retrieval results for accuracy','Hybrid search: dense (vector) + sparse (BM25 keyword) retrieval combined','Chunking overlap: prevent context loss at boundaries (e.g. 100 token overlap)','Evaluation: RAGAS metrics — faithfulness, answer relevancy, context precision'],
        questions:['Explain the full RAG pipeline from document to answer.','What chunk size would you choose and why?','How does hybrid search improve over pure vector search?','What is a cross-encoder reranker? When would you use it?','How do you evaluate the quality of a RAG system?','What is the difference between RAG and fine-tuning?','How would you handle PDFs with tables and images in RAG?'],
        resources:[
