          {name:'DeepLearning.AI RAG Course (free)',type:'Course',url:'https://www.deeplearning.ai/short-courses/building-and-evaluating-advanced-rag/',ico:'📘'},
          {name:'Pinecone Learn RAG',type:'Tutorial',url:'https://www.pinecone.io/learn/retrieval-augmented-generation/',ico:'📄'},
        ]},
       {id:'t_agents',name:'AI Agents & Agentic Systems',diff:'medium',hrs:10,
        tags:['ReAct','Tool Use','LangGraph','Multi-Agent'],
        about:'Agents are LLMs that use tools, plan multi-step, and act autonomously. The fastest-growing AI engineering skill. LangGraph and AutoGen are the leading frameworks.',
        concepts:['ReAct pattern — Reason + Act cycles: Think → Tool → Observe → Think...','Tool use/Function calling — LLM outputs structured JSON to call external APIs','Agent memory: in-context (messages), external (vector store), episodic','LangGraph — stateful workflows with nodes, edges, conditional branching, human-in-loop','Multi-agent — specialized agents collaborate (planner, executor, critic, coder)','Agent evaluation — trajectory correctness, final answer, tool usage accuracy','Guardrails — input/output validation, toxicity, PII detection'],
        questions:['What is the ReAct framework for LLM agents?','How does function calling work in the OpenAI/Anthropic API?','When would you use LangGraph vs a simple chain?','What types of memory can an AI agent have?','How do you prevent an agent from going into an infinite loop?','How would you build a coding agent that writes and runs code?','What is the difference between a sequential and a parallel agent workflow?'],
        resources:[
          {name:'LangChain Academy — LangGraph (free)',type:'Course',url:'https://academy.langchain.com/',ico:'📘'},
          {name:'DeepLearning.AI Agents Course',type:'Course',url:'https://www.deeplearning.ai/short-courses/ai-agents-in-langgraph/',ico:'📘'},
          {name:'Anthropic Tool Use Docs',type:'Docs',url:'https://docs.anthropic.com/en/docs/build-with-claude/tool-use',ico:'📄'},
        ]},
       {id:'t_ft',name:'Fine-Tuning LLMs — LoRA, QLoRA',diff:'hard',hrs:10,
        tags:['LoRA','QLoRA','PEFT','Instruction Tuning'],
        about:'Fine-tuning customizes a pretrained model for your specific task. LoRA makes this affordable on consumer GPUs. This skill differentiates ML engineers from LLM app developers.',
        concepts:['Full fine-tuning — update all weights, requires massive GPU, usually unnecessary','Parameter Efficient Fine-Tuning (PEFT) — update small subset of weights','LoRA — Low-Rank Adaptation, inject low-rank matrices (r=8 to 64) into attention layers','QLoRA — quantize base model to 4-bit, then apply LoRA — runs on 16GB GPU','Instruction tuning — finetune on (instruction, response) pairs to follow instructions','DPO (Direct Preference Optimization) — align model using human preference pairs','Dataset format: Alpaca format (instruction, input, output) or ChatML format','Evaluation: perplexity, task-specific metrics, LLM-as-judge'],
        questions:['When would you fine-tune vs use RAG vs prompt engineer?','What is LoRA? Why does low-rank work?','How does QLoRA reduce GPU memory requirements?','What is instruction tuning? How does it differ from pretraining?','What data format do you need for fine-tuning?','How do you evaluate if fine-tuning improved the model?','What is catastrophic forgetting and how do you avoid it?'],
        resources:[
          {name:'Hugging Face PEFT Docs',type:'Docs',url:'https://huggingface.co/docs/peft/index',ico:'📄'},
          {name:'Axolotl — Fine-tuning framework',type:'GitHub',url:'https://github.com/axolotl-ai-cloud/axolotl',ico:'📄'},
          {name:'Sebastian Raschka LLM Blog',type:'Article',url:'https://sebastianraschka.com/blog/',ico:'📄'},
        ]},
     ]},
    {id:'fullstack',ico:'▤',lbl:'Full Stack',title:'Full Stack Development',
     desc:'Build complete web apps end-to-end. High demand at every product startup, SaaS company, and MNC. Best for SDE roles.',
     hrs:95,
     topics:[
       {id:'t_js',name:'JavaScript — Deep Dive',diff:'medium',hrs:15,
        tags:['Closures','Event Loop','Promises','Prototype'],
        about:'JavaScript is the most important language for web engineering. Interviewers love asking about closures, the event loop, and async. These are not optional.',
        concepts:['Execution Context & Call Stack — how JS runs code','Hoisting — var (undefined), let/const (TDZ), function declarations','Closure — inner function retains access to outer scope after outer function returns','Prototype chain — objects inherit from __proto__, basis of OOP in JS','Event Loop — call stack + callback queue + microtask queue (Promises > setTimeout)','Promises — resolve/reject, .then chaining, error propagation','async/await — syntactic sugar over Promises, still non-blocking','Event delegation — one listener on parent, check event.target (memory efficient)'],
        questions:['What is a closure? Give a practical use case.','Explain the JavaScript event loop. What runs first — setTimeout or Promise?','What is the difference between var, let, and const?','What is prototype chain? How does inheritance work in JS?','How does async/await differ from Promises?','What is event delegation? Why use it?','Explain the difference between == and === in JS.','What is debounce vs throttle? Implement debounce.'],

        about:'React is the dominant frontend library. Interviewers test hook internals, rendering behavior, and performance optimization. Senior roles also ask about reconciliation and Fiber.',
        concepts:['useState — local state, triggers re-render on state change','useEffect — side effects, dependency array, cleanup function','useCallback/useMemo — memoize function/value, prevent unnecessary recalculation','useRef — mutable ref, persist across renders without re-render','Custom hooks — extract stateful logic into reusable functions','React reconciliation — virtual DOM diffing, key prop for lists','Context API — prop drilling solution, avoid for frequent updates (performance)','Code splitting — React.lazy + Suspense for dynamic imports'],
        questions:['What is the difference between useEffect and useLayoutEffect?','How does useCallback prevent re-renders in child components?','When would you use useRef instead of useState?','What is the React reconciliation algorithm?','What is prop drilling? How do you solve it?','How does React Suspense work?','Explain React.memo — when does it NOT help?','What is the difference between controlled and uncontrolled components?'],

    {id:'cloud',ico:'◐',lbl:'Cloud/DevOps',title:'Cloud & DevOps Engineering',

        about:'Docker is mandatory for any cloud or backend role. You must be able to containerize an app, write good Dockerfiles, and compose multi-service applications.',
        concepts:['Container = process + filesystem snapshot, lightweight vs VM','Dockerfile: FROM, RUN, COPY, ENV, EXPOSE, ENTRYPOINT vs CMD','Layer caching — order instructions from least to most changed (COPY package.json first)','Multi-stage build — build in one stage, copy artifact to lean runtime image','Docker networks: bridge (default), host (no isolation), overlay (swarm)','Docker volumes — named volumes for data persistence across container restarts','.dockerignore — exclude node_modules, .git from build context','docker-compose — define multi-service apps, service discovery by service name'],

  {cat:'LAYER 3 — HOT 2027-28 SKILLS',color:'var(--amber)',lc:'l3',subjects:[
    {id:'mlops',ico:'◐',lbl:'MLOps',title:'MLOps & AI Infrastructure',

       {id:'t_serving',name:'Model Serving — FastAPI, Triton, Ray Serve',diff:'medium',hrs:8,

function allSubjects(){
  const o=[];
  DATA.forEach(g=>g.subjects&&g.subjects.forEach(s=>o.push({...s,lc:g.lc,gcolor:g.color})));
  return o;
}
function allTopics(){
  const o=[];
  allSubjects().forEach(s=>(s.topics||[]).forEach(t=>o.push({...t,sid:s.id})));
  return o;
}
function findSubj(id){return allSubjects().find(s=>s.id===id);}
function findTopic(id){return allTopics().find(t=>t.id===id);}
function sStats(s){
  const tot=(s.topics||[]).length;
  const done=(s.topics||[]).filter(t=>progress[t.id]==='done').length;
  const inp=(s.topics||[]).filter(t=>progress[t.id]==='in_progress').length;
  return{tot,done,inp,pct:tot?Math.round(done/tot*100):0};
}
function gStats(){
  const all=allTopics();
  const done=all.filter(t=>progress[t.id]==='done').length;
  const inp=all.filter(t=>progress[t.id]==='in_progress').length;
  return{total:all.length,done,inp,left:all.length-done-inp,pct:all.length?Math.round(done/all.length*100):0};
}
function escapeHtml(str) {
  return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
}

// ============================
function updatePomoDisplay() {
  const mins = Math.floor(pomoTimeRemaining / 60);
  const secs = pomoTimeRemaining % 60;
  const timeDisplay = document.getElementById('pomo-time');
  if (timeDisplay) {
    timeDisplay.textContent = (mins < 10 ? '0' : '') + mins + ':' + (secs < 10 ? '0' : '') + secs;
  }
  
  const statusEl = document.getElementById('pomo-status');
  if (statusEl) {
    if (pomoState === 'running') {
      statusEl.textContent = 'Focusing';
      statusEl.style.color = 'var(--cyan)';
    } else if (pomoState === 'paused') {
      statusEl.textContent = 'Paused';
      statusEl.style.color = 'var(--amber)';
    } else {
      statusEl.textContent = 'Idle';
      statusEl.style.color = 'var(--text3)';
    }
  }

  // Active topic title
  const activeTopicEl = document.getElementById('pomo-active-topic');
  if (activeTopicEl) {
    if (openTopicId) {
      const t = findTopic(openTopicId);
      if (t) {
        pomoTopicId = openTopicId;
        activeTopicEl.textContent = 'Studying: ' + t.name;
      }
    } else if (pomoTopicId) {
      const t = findTopic(pomoTopicId);
      if (t) activeTopicEl.textContent = 'Studying: ' + t.name;
    } else {
      activeTopicEl.textContent = 'No active topic';
    }
  }
}

function setPomoPreset(mins) {
  clearInterval(pomoInterval);
  pomoState = 'idle';
  pomoDuration = mins * 60;
  pomoTimeRemaining = pomoDuration;
  
  document.querySelectorAll('.pomo-preset').forEach(btn => btn.classList.remove('active'));
  const activePresetBtn = document.getElementById('preset-' + mins);
  if (activePresetBtn) activePresetBtn.classList.add('active');
  
  const startBtn = document.getElementById('pomo-start-btn');
  if (startBtn) {
    startBtn.textContent = '▶ Start';
    startBtn.classList.remove('active');
  }

  updatePomoDisplay();
}

function togglePomo() {
  const startBtn = document.getElementById('pomo-start-btn');
  if (!startBtn) return;
  
  if (pomoState === 'running') {
    // Pause
    clearInterval(pomoInterval);
    pomoState = 'paused';
    startBtn.textContent = '▶ Resume';
    startBtn.classList.remove('active');
  } else {
    // Start or Resume
    pomoState = 'running';
    startBtn.textContent = '⏸ Pause';
    startBtn.classList.add('active');
    
    // Set active topic if available
    if (openTopicId) pomoTopicId = openTopicId;
    
    pomoInterval = setInterval(() => {
      pomoTimeRemaining--;
      if (pomoTimeRemaining <= 0) {
        clearInterval(pomoInterval);
        pomoState = 'idle';
        pomoTimeRemaining = pomoDuration;
        startBtn.textContent = '▶ Start';
        startBtn.classList.remove('active');
        playPomoAlarm();
        alert('🎉 Focus session completed! Take a break.');
      }
      updatePomoDisplay();
    }, 1000);
  }
  updatePomoDisplay();
}

function resetPomo() {
  clearInterval(pomoInterval);
  pomoState = 'idle';
  pomoTimeRemaining = pomoDuration;
  const startBtn = document.getElementById('pomo-start-btn');
  if (startBtn) {
    startBtn.textContent = '▶ Start';
    startBtn.classList.remove('active');
  }
  updatePomoDisplay();
}

function playPomoAlarm() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (!ctx) return;
    
    // Play a dual chime: first note C5 (523.25Hz), second note E5 (659.25Hz)
    const playNote = (freq, time, duration) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.15, time);
      gain.gain.exponentialRampToValueAtTime(0.001, time + duration);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(time);
      osc.stop(time + duration);
    };

    const now = ctx.currentTime;
    playNote(523.25, now, 0.4);
    playNote(659.25, now + 0.15, 0.5);
  } catch (e) {
    console.error('Failed to play audio alert:', e);
  }
}

function toggleStar(tid, e){
  if(e) e.stopPropagation();
  starred[tid] = !starred[tid];
  saveStarred();
  
  updateHeader();
  renderSidebar();
  if(activeId==='__home__') renderHome();
  else if(activeId==='__starred__') renderStarred();
  else if(activeId==='__search__') renderSearch(document.getElementById('search-input').value);
  else renderSubject(activeId);
  
  const starBtn = document.querySelector('.dp-star-btn');
  if(starBtn && openTopicId===tid) {
    if(starred[tid]) {
      starBtn.classList.add('active');
    } else {
      starBtn.classList.remove('active');
    }
  }
}

function renderSubject(id){
  const s=findSubj(id);
  if(!s)return;
  const g=DATA.find(g=>g.subjects&&g.subjects.find(x=>x.id===id));
  const ss=sStats(s);
  const lmap={l1:'Layer 1 — Foundation',l2:'Layer 2 — Core Track',l3:'Layer 3 — Hot 2027-28',l4:'Layer 4 — Career'};
  
  let topics=s.topics||[];
  
  // 1. Completion filter
  if(filterState==='done')topics=topics.filter(t=>progress[t.id]==='done');
  else if(filterState==='in_progress')topics=topics.filter(t=>progress[t.id]==='in_progress');
  else if(filterState==='remaining')topics=topics.filter(t=>!progress[t.id]||progress[t.id]==='not_started');

  // 2. Difficulty filter
  if(difficultyFilter!=='all') {
    topics=topics.filter(t=>t.diff===difficultyFilter);
  }

  // 3. Sorting
  const diffWeight = { easy: 1, medium: 2, hard: 3 };
  if(sortState==='alphabetical') {
    topics=[...topics].sort((a,b)=>a.name.localeCompare(b.name));
  } else if(sortState==='duration_asc') {
    topics=[...topics].sort((a,b)=>(a.hrs||0)-(b.hrs||0));
  } else if(sortState==='duration_desc') {
    topics=[...topics].sort((a,b)=>(b.hrs||0)-(a.hrs||0));
  } else if(sortState==='difficulty_asc') {
    topics=[...topics].sort((a,b)=>diffWeight[a.diff]-diffWeight[b.diff]);
  } else if(sortState==='difficulty_desc') {
    topics=[...topics].sort((a,b)=>diffWeight[b.diff]-diffWeight[a.diff]);
  }

  let h=`<div class="sv-header anim">
    <div class="layer-badge ${s.lc}">${lmap[s.lc]}</div>
    <div class="sv-title">${s.title}</div>
    <div class="sv-desc">${s.desc}</div>
    <div class="sv-meta">
      <span class="sv-chip">📚 ${(s.topics||[]).length} topics</span>
      <span class="sv-chip">⏱ ~${s.hrs}h total</span>
      <span class="sv-chip" style="color:var(--green)">✓ ${ss.done} done</span>
      <span class="sv-chip" style="color:var(--amber)">◐ ${ss.inp} in progress</span>
    </div>
  </div>
  <div class="fbar" style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;">
    <div style="display:flex; gap:6px; flex-wrap:wrap;">
      <button class="fb ${filterState==='all'?'on':''}" onclick="setFilter('all')">All (${(s.topics||[]).length})</button>
      <button class="fb ${filterState==='remaining'?'on':''}" onclick="setFilter('remaining')">Remaining (${(s.topics||[]).filter(t=>!progress[t.id]||progress[t.id]==='not_started').length})</button>
      <button class="fb ${filterState==='in_progress'?'on':''}" onclick="setFilter('in_progress')">In Progress (${(s.topics||[]).filter(t=>progress[t.id]==='in_progress').length})</button>
      <button class="fb ${filterState==='done'?'on':''}" onclick="setFilter('done')">Done (${ss.done})</button>
    </div>
    <div style="display:flex; gap:8px; align-items:center;">
      <span style="font-size:11px; color:var(--text2); font-family:var(--fm);">Diff:</span>
      <select onchange="setDiffFilter(this.value)" class="sort-select">
        <option value="all" ${difficultyFilter==='all'?'selected':''}>All</option>
        <option value="easy" ${difficultyFilter==='easy'?'selected':''}>🟢 Easy</option>
        <option value="medium" ${difficultyFilter==='medium'?'selected':''}>🟡 Medium</option>
        <option value="hard" ${difficultyFilter==='hard'?'selected':''}>🔴 Hard</option>
      </select>
      <span style="font-size:11px; color:var(--text2); font-family:var(--fm); margin-left:6px;">Sort:</span>
      <select onchange="setSort(this.value)" class="sort-select">
        <option value="default" ${sortState==='default'?'selected':''}>Recommended</option>
        <option value="alphabetical" ${sortState==='alphabetical'?'selected':''}>A-Z</option>
        <option value="duration_asc" ${sortState==='duration_asc'?'selected':''}>Duration (Low-High)</option>
        <option value="duration_desc" ${sortState==='duration_desc'?'selected':''}>Duration (High-Low)</option>
        <option value="difficulty_asc" ${sortState==='difficulty_asc'?'selected':''}>Difficulty (Easy-Hard)</option>
        <option value="difficulty_desc" ${sortState==='difficulty_desc'?'selected':''}>Difficulty (Hard-Easy)</option>
      </select>
    </div>
  </div>
  <div class="tgrid anim">`;

  if(!topics.length){h+=`<div class="empty">No topics match this filter/sorting combo.</div>`;}
  topics.forEach(t=>{
    const st=progress[t.id]||'not_started';
    const sico=st==='done'?'✓':st==='in_progress'?'◐':'';
    const dc=t.diff==='easy'?'de':t.diff==='medium'?'dm':'dh';
    const tagHtml=(t.tags||[]).map(tg=>`<span class="tc-tag">${tg}</span>`).join('');
    const isStarred = starred[t.id] ? 'active' : '';
    const hasNotes = notes[t.id] && notes[t.id].trim();
    h+=`<div class="tc ${st}" id="tc_${t.id}">
      <div class="tc-status" onclick="cycleStatus('${t.id}','${id}',event)" title="Click to mark progress">${sico}</div>
      <div class="tc-info" onclick="openPanel('${t.id}')" style="cursor:pointer">
        <div class="tc-name" style="display:flex;align-items:center;gap:6px">
          <span class="tc-star ${isStarred}" onclick="toggleStar('${t.id}',event)">★</span>
          <span>${t.name}</span>
          ${hasNotes ? `<span class="tc-notes-indicator" title="Has study notes">📝</span>` : ''}
        </div>
        <div class="tc-tags">${tagHtml}</div>
      </div>
      <div class="tc-right">
        <span class="db ${dc}">${t.diff}</span>
        <span class="hrs">~${t.hrs}h</span>
        <button class="open-btn" onclick="openPanel('${t.id}')">Study →</button>

  });
  h+=`</div>`;
  document.getElementById('main').innerHTML=h;
}

// ============================
function toggleQuestionAccordion(tid, index) {
  const card = document.getElementById(`qp_${tid}_${index}`);
  if (card) {
    card.classList.toggle('open');
  }
}

function toggleQuestionMastery(tid, index, event) {
  if (event) event.stopPropagation();
  
  if (!masteredQs[tid]) masteredQs[tid] = [];
  
  const idx = masteredQs[tid].indexOf(index);
  if (idx > -1) {
    masteredQs[tid].splice(idx, 1);
  } else {
    masteredQs[tid].push(index);
  }
  
  saveMasteredQs();
  
  const checkbox = document.querySelector(`#qp_${tid}_${index} .qp-checkbox`);

function getQuestionHint(topicId, qText) {
  const q = qText.toLowerCase();
  if (q.includes('two sum')) return 'Use a HashMap/HashSet to store the complement (target - current_val). This achieves O(n) time complexity and O(n) space complexity. Alternatively, if sorted, use two pointers converging from both ends.';
  if (q.includes('stock')) return 'Keep track of the minimum price seen so far and calculate maximum profit at each step (Single pass O(n) time, O(1) space).';
  if (q.includes('longest substring without repeating')) return 'Sliding Window pattern: maintain a left and right pointer, and a map of character indices. Shrink the window when a duplicate character is found.';
  if (q.includes('container with most water')) return 'Two-pointer technique: initialize left pointer at 0 and right pointer at array length - 1. Calculate area, and shift the pointer that has the smaller height.';
  if (q.includes('trapping rain water')) return 'Compute prefix max and suffix max arrays for each position. Alternatively, use a two-pointer approach (left and right) with leftMax and rightMax variables for O(1) space.';
  if (q.includes('reverse linked list')) return 'Iterative: maintain prev, curr, and next pointers. Change curr.next to prev, then move prev and curr forward. Recursive: reverse the rest, then point the original second node back to head.';
  if (q.includes('cycle')) return 'Floyd\'s Cycle Detection (Tortoise and Hare): fast pointer moves 2 steps, slow moves 1. If they meet, a cycle exists. To find cycle entry point, reset slow to head, move both 1 step at a time until they meet.';
  if (q.includes('valid parentheses')) return 'Use a Stack. Push opening brackets. When a closing bracket appears, pop from the stack and verify it matches. Stack must be empty at the end.';
  if (q.includes('lru cache')) return 'Design using a HashMap mapped to nodes of a Doubly Linked List. HashMap provides O(1) lookups, while Doubly Linked List allows O(1) updates and eviction of least recently used items.';
  if (q.includes('histogram')) return 'Use a Monotonic Stack to find the next smaller element on both left and right for each bar. The maximum area for each bar is its height times the distance between the two boundary indexes.';
  if (q.includes('islands')) return 'BFS or DFS on the grid. Iterate through each cell; when a \'1\' (land) is found, trigger a traversal to mark all connected land cells as visited (or turn them to \'0\') and increment the counter.';
  if (q.includes('course schedule')) return 'Topological Sort (Kahn\'s algorithm or DFS cycle detection). A cycle indicates that it\'s impossible to complete all courses (directed cyclic graph).';
  if (q.includes('dijkstra')) return 'Single-Source Shortest Path. Use a Priority Queue (Min-Heap) storing pairs of (distance, node). Relax edges and insert adjacent nodes with updated distances. Time: O((V+E)log V).';
  if (q.includes('knapsack')) return '0/1 Knapsack: decision is to include or exclude item. Table dp[i][w] represents max value with first i items and weight limit w. Space optimization reduces 2D table to 1D.';
  if (q.includes('climbing stairs')) return 'Recognize this as a Fibonacci sequence. dp[i] = dp[i-1] + dp[i-2]. Can be optimized to O(1) space using variables.';
  if (q.includes('coin change')) return 'Unbounded Knapsack: dp[i] represents minimum coins to make change for amount i. Recurrence: dp[i] = min(dp[i], dp[i - coin] + 1) for each coin.';
  if (q.includes('lcs') || q.includes('longest common subsequence')) return '2D DP. If string1[i] == string2[j], dp[i][j] = 1 + dp[i-1][j-1]. Otherwise, dp[i][j] = max(dp[i-1][j], dp[i][j-1]).';
  if (q.includes('n-queens')) return 'Backtracking. Place a queen row-by-row, validating columns and diagonals. If a placement fails down the line, backtrack by removing the queen (unchoose) and try the next position.';
  if (q.includes('trie')) return 'Implement children array (size 26) or hash map for characters, and a boolean isEndOfWord flag. Insert and search are O(L) where L is the length of the string.';
  if (q.includes('binary search')) return 'Maintain lo and hi bounds. Check mid = lo + (hi - lo)/2. Adjust lo = mid + 1 or hi = mid - 1 based on comparison. Answer binary search uses mono-property to find bounds.';
  
  if (topicId.startsWith('t_sd')) return 'System Design Framework: 1. Clarify requirements (Functional/Non-functional). 2. Establish scale (QPS, Storage, Bandwidth). 3. Define APIs. 4. High-level diagram (LB, App, DB, Cache). 5. Deep dive details (Sharding, Queue, Sync).';
  if (topicId.startsWith('t_lld')) return 'LLD Strategy: 1. Define entities and actors. 2. Establish relationships (UML). 3. Create interfaces. 4. Apply Design Patterns (Strategy, State, Factory, Singleton). 5. Write clean code.';
  
  return 'Study Tip: Write out a visual representation of this problem. Trace edge cases (null inputs, empty values, single elements) and state the time and space complexity before writing the optimal code.';
}

function runPlaygroundCode(tid) {
  const code = document.getElementById('pg-editor-area').value;
  const logsArea = document.getElementById('pg-console-logs-area');
  logsArea.innerHTML = '';
  
  const logMessages = [];
  const originalLog = console.log;
  const originalWarn = console.warn;
  const originalError = console.error;
  
  console.log = function(...args) {
    logMessages.push({ type: 'log', text: args.map(a => typeof a === 'object' ? JSON.stringify(a) : String(a)).join(' ') });
    originalLog.apply(console, args);
  };
  console.warn = function(...args) {
    logMessages.push({ type: 'warn', text: args.map(a => typeof a === 'object' ? JSON.stringify(a) : String(a)).join(' ') });
    originalWarn.apply(console, args);
  };
  console.error = function(...args) {
    logMessages.push({ type: 'error', text: args.map(a => typeof a === 'object' ? JSON.stringify(a) : String(a)).join(' ') });
    originalError.apply(console, args);
  };
  
  try {
    const runFn = new Function(code);
    runFn();
    
    if (logMessages.length === 0) {
      logsArea.innerHTML = `<span class="pg-log-info">// Execution finished successfully with no console logs.</span>`;
    } else {
      logsArea.innerHTML = logMessages.map(msg => {
        let cls = 'pg-log-line';
        if (msg.type === 'error' || msg.type === 'warn') cls += ' pg-log-error';
        return `<div class="${cls}">${escapeHtml(msg.text)}</div>`;
      }).join('');
    }
  } catch (err) {
    logsArea.innerHTML = `<div class="pg-log-line pg-log-error">❌ Execution Error:\n${escapeHtml(err.message)}</div>`;
  } finally {
    console.log = originalLog;
    console.warn = originalWarn;
    console.error = originalError;
  }
}

function clearConsoleOutput() {
  const logsArea = document.getElementById('pg-console-logs-area');
  if (logsArea) {
    logsArea.innerHTML = `<span class="pg-log-info">// Console cleared.</span>`;
  }
}

    masteredQs: masteredQs,
    theme: currentTheme,
    exportedAt: new Date().toISOString()
  };
  
  const jsonString = JSON.stringify(exportPayload, null, 2);
  const blob = new Blob([jsonString], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  
  const a = document.createElement('a');
  a.href = url;
  a.download = `20lpa_backup_${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function importData(event) {
  const file = event.target.files[0];
  if (!file) return;
  
  const reader = new FileReader();
  reader.onload = async function(e) {
    try {
      const data = JSON.parse(e.target.result);
      if (!data || typeof data !== 'object') {
        alert('Invalid backup file structure.');
        return;
      }
      
      if (confirm('Importing this file will overwrite all your current study progress, notes, and stars. Do you want to proceed?')) {
        progress = data.progress || {};
        starred = data.starred || {};
        notes = data.notes || {};
        masteredQs = data.masteredQs || {};
        if (data.theme) {
          currentTheme = data.theme;
          const themeSelector = document.getElementById('theme-selector');
          if (themeSelector) themeSelector.value = currentTheme;
          applyTheme(currentTheme);
        }
        
        // Save to storage
        await saveProg();
        await saveStarred();
        await saveNotes();
        await saveMasteredQs();
        await saveTheme();
        
        // Refresh UI
        updateHeader();
        renderSidebar();
        renderHome();
        
        alert('🎉 Study data imported successfully!');
      }
    } catch(err) {
      alert('Error parsing JSON backup file: ' + err.message);
    }
  };
  reader.readAsText(file);
}

function startInterviewSession() {
  const selector = document.getElementById('mi-track-select');
  if (!selector) return;
  interviewSubject = selector.value;
  
  const allT = allTopics();
  let selectedQuestions = [];
  
  if (interviewSubject === 'random') {
    allT.forEach(t => {
      (t.questions || []).forEach(q => selectedQuestions.push({ text: q, topicId: t.id }));
    });
  } else {
    allT.forEach(t => {
      const s = findSubj(interviewSubject);
      if (s && s.topics && s.topics.find(x => x.id === t.id)) {
        (t.questions || []).forEach(q => selectedQuestions.push({ text: q, topicId: t.id }));
      }
    });
  }
  
  if (selectedQuestions.length === 0) {
    alert("No questions found in this track!");
    return;
  }
  
  interviewQuestions = selectedQuestions.sort(() => 0.5 - Math.random());
  interviewIndex = 0;
  interviewActive = true;
  interviewHistory = [];
  interviewEvaluation = null;
  
  askInterviewQuestion();
}

function askInterviewQuestion() {
  if (interviewIndex >= interviewQuestions.length) {
    interviewQuestions = interviewQuestions.sort(() => 0.5 - Math.random());
    interviewIndex = 0;
  }
  
  const activeQObj = interviewQuestions[interviewIndex];
  const qText = activeQObj.text;
  
  const evalData = getKeywordsAndModelAnswer(qText);
  interviewKeywords = evalData.keywords;
  interviewModelAnswer = evalData.modelAnswer;
  interviewEvaluation = null;
  
  interviewHistory.push({
    sender: 'bot',
    text: `Hello! I'm your SDE technical interviewer today. Let's discuss a core concept in SDE interview preparation. Can you explain: "${qText}"?`
  });
  
  renderMockInterview();
  
  const input = document.getElementById('mi-answer-input');
  if (input) input.focus();
}

function submitInterviewAnswer() {
  const input = document.getElementById('mi-answer-input');
  if (!input) return;
  const answer = input.value.trim();
  if (!answer) return;
  
  if (interviewEvaluation) return;
  
  interviewHistory.push({
    sender: 'user',
    text: answer
  });
  
  const lowerAnswer = answer.toLowerCase();
  const matched = [];
  const missed = [];
  
  interviewKeywords.forEach(kw => {
    const cleanKw = kw.toLowerCase().replace(/[()]/g, '');
    if (lowerAnswer.includes(cleanKw)) {
      matched.push(kw);
    } else {
      missed.push(kw);
    }
  });
  
  const score = Math.round((matched.length / interviewKeywords.length) * 100);
  interviewEvaluation = {
    score: score,
    matched: matched,
    missed: missed,
    total: interviewKeywords.length
  };
  
  let responseMsg = '';
  if (score >= 80) {
    responseMsg = `Excellent answer! You hit almost all key concepts: [${matched.join(', ')}]. That demonstrates robust SDE architectural proficiency. Let's move on to the next question.`;
  } else if (score >= 50) {
    responseMsg = `Good attempt. You successfully mentioned [${matched.join(', ')}]. However, you missed some important terminology like [${missed.join(', ')}]. Check out the model guidance on the right to plug your knowledge gaps!`;
  } else {
    responseMsg = `Thanks for your response. To succeed in a 20 LPA round, you need to expand on details. You missed key structural elements like [${missed.join(', ')}]. Take a look at the model answer guidance on the right to review this topic.`;
  }
  
  interviewHistory.push({
    sender: 'bot',
    text: responseMsg
  });
  
  renderMockInterview();
}

function nextInterviewQuestion() {
  interviewIndex++;
  interviewEvaluation = null;
  askInterviewQuestion();
}

function resetInterviewSession() {
  if (confirm("Are you sure you want to end this interview session? Your current progress will be lost.")) {
    interviewActive = false;
    interviewHistory = [];
    interviewEvaluation = null;
    renderMockInterview();
  }
}

function getKeywordsAndModelAnswer(qText) {
  const q = qText.toLowerCase();
  
  let keywords = ["concept", "explanation", "complexity", "optimization"];
  let modelAnswer = "SDE Tip: To answer this question successfully, describe the core system components, explain trade-offs (such as time/space complexity or read/write latency), and mention specific protocols or data structures involved. E.g., for system design, cover scalability, databases, and caching. For algorithms, explain the optimal time and space complexity first.";
  
  if (q.includes("two sum")) {
    keywords = ["hashmap", "target", "complement", "o(n) time", "o(n) space"];
    modelAnswer = "Optimal approach uses a HashMap. Iterate through the array; for each number, calculate its complement (target - current). If the complement is in the map, return their indices. Otherwise, store the current number and index. This takes O(N) time and O(N) space.";
  }
  else if (q.includes("linked list cycle") || q.includes("cycle ii")) {
    keywords = ["floyd", "slow", "fast", "pointers", "entry point", "meet"];
    modelAnswer = "Use Floyd's Cycle Detection. Run a fast pointer (2 steps) and a slow pointer (1 step). If they meet, there is a cycle. To find the entry point, reset slow to head and move both slow and fast 1 step at a time; their next meeting point is the cycle start.";
  }
  else if (q.includes("reverse linked list")) {
    keywords = ["prev", "curr", "next", "iterative", "recursive", "pointers"];
    modelAnswer = "Iterative method uses 3 pointers: prev (null), curr (head), and nextTemp. Loop through the list, store curr.next in nextTemp, set curr.next to prev, move prev to curr, and curr to nextTemp. Return prev.";
  }
  else if (q.includes("valid parentheses")) {
    keywords = ["stack", "opening", "closing", "pop", "match", "empty"];
    modelAnswer = "Push opening brackets onto a stack. When a closing bracket appears, pop the top of the stack and check if it matches. If not, or if the stack is empty, return false. The stack must be empty at the end.";
  }
  else if (q.includes("lru cache")) {
    keywords = ["hashmap", "doubly linked list", "o(1)", "least recently used", "evict"];
    modelAnswer = "Implement using a HashMap mapped to nodes of a Doubly Linked List. The HashMap provides O(1) lookups. The Doubly Linked List keeps track of access order, allowing O(1) insertion, update, and eviction of the least recently used node.";
  }
  else if (q.includes("islands")) {
    keywords = ["dfs", "bfs", "connected components", "grid", "visited", "directions"];
    modelAnswer = "Traverse the grid. When a '1' is found, increment the island count and run DFS/BFS to traverse and flip all adjacent connected land cells ('1's) to '0's (or mark them visited) to ensure they are not counted twice.";
  }
  else if (q.includes("course schedule")) {
    keywords = ["topological sort", "cycle", "directed graph", "indegree", "kahn"];
    modelAnswer = "Represent courses as a directed graph. Detect cycles using DFS (checking back-edges) or Kahn's BFS algorithm (checking if in-degrees don't reduce to 0). A cycle means the courses cannot be completed.";
  }
  else if (q.includes("deadlock")) {
    keywords = ["mutual exclusion", "hold and wait", "no preemption", "circular wait", "banker", "prevention"];
    modelAnswer = "Deadlock requires 4 conditions: Mutual Exclusion, Hold & Wait, No Preemption, and Circular Wait. Prevent deadlock by breaking any of these, or avoid it dynamically using the Banker's Algorithm.";
  }
  else if (q.includes("virtual memory") || q.includes("paging")) {
    keywords = ["page table", "tlb", "physical address", "page fault", "mmu"];
    modelAnswer = "Virtual Memory maps process logic to physical RAM via page tables. The CPU uses the translation lookaside buffer (TLB) for fast lookup. A page fault occurs when a requested page is not in physical RAM, forcing disk retrieval.";
  }
  else if (q.includes("acid")) {
    keywords = ["atomicity", "consistency", "isolation", "durability", "transactions", "rollback", "wal"];
    modelAnswer = "ACID defines transactions. Atomicity (all or nothing), Consistency (preserves integrity constraints), Isolation (concurrent runs don't interfere), and Durability (saved commits survive crashes). WAL is used for durability.";
  }
  else if (q.includes("index") || q.includes("b+ tree")) {
    keywords = ["b+ tree", "leaf nodes", "range scan", "clustered", "non-clustered", "explain"];
    modelAnswer = "Indexing speeds up query execution. B+ Trees are preferred because intermediate nodes only contain keys, and all data is in the leaf nodes, which are linked together for fast sequential range scans.";
  }
  else if (q.includes("scale") || q.includes("horizontal")) {
    keywords = ["horizontal", "vertical", "load balancer", "sharding", "stateless"];
    modelAnswer = "Scaling out (horizontal) adds more machines and requires a Load Balancer to distribute traffic, sharding databases, and making application servers stateless. Scaling up (vertical) increases CPU/RAM of a single host.";
  }
  else if (q.includes("url shortener")) {
    keywords = ["base62", "hashing", "key generator", "redirect 301", "redirect 302", "database"];
    modelAnswer = "For a URL shortener, encode an auto-incrementing ID or generated hash in Base62 to produce a 6-7 character key. Store in a fast NoSQL or SQL table. Use a 302 redirect for temporary tracking or 301 for SEO caching.";
  }
  else if (q.includes("whatsapp") || q.includes("chat")) {
    keywords = ["websocket", "heartbeat", "cassandra", "presence", "signal", "push notification"];
    modelAnswer = "Use WebSockets for full-duplex persistent connections. Use Redis for presence (heartbeats). Store message history in Cassandra (highly performant time-series writes). Use gateway push notifications for offline clients.";
  }
  else if (q.includes("uber") || q.includes("ride")) {
    keywords = ["geospatial", "quadtree", "google s2", "matching", "websocket"];
    modelAnswer = "Uber-style design uses QuadTrees or Google S2 cells to index driver coordinates. Drivers stream GPS updates via WebSockets. The system queries nearby cells, filters candidates, and locks driver-rider assignments.";
  }
  else if (q.includes("vpc") || q.includes("subnet")) {
    keywords = ["private subnet", "public subnet", "nat gateway", "internet gateway", "route table"];
    modelAnswer = "A VPC isolates cloud infrastructure. A public subnet has a route to an Internet Gateway. A private subnet does not; it accesses the outbound internet securely via a NAT Gateway located in a public subnet.";
  }
  else if (q.includes("k8s") || q.includes("kubernetes") || q.includes("service")) {
    keywords = ["clusterip", "nodeport", "loadbalancer", "ingress", "pods"];
    modelAnswer = "A K8s Service routes traffic to Pods. ClusterIP is internal-only. NodePort opens a static port on each worker node. LoadBalancer integrates with cloud providers. Ingress manages HTTP/S external entry routing.";
  }
  else if (q.includes("terraform") || q.includes("state")) {
    keywords = ["state file", "locking", "plan", "apply", "remote backend", "hcl"];
    modelAnswer = "The Terraform state file tracks resource configurations. State locking (via DynamoDB) prevents concurrent runs from corrupting states. Remote backends (like S3) store state securely for collaboration.";
  }
  else if (q.includes("ci/cd") || q.includes("github actions")) {
    keywords = ["continuous integration", "continuous deployment", "secrets", "runners", "workflows"];
    modelAnswer = "CI automates checking out, compiling, and testing code. CD automates building images and deploying them to staging/production. Workflows run on GitHub runners, pulling credentials from encrypted secrets stores.";
  }
  else if (q.includes("sde-1") || q.includes("sde-2") || q.includes("expectations") || q.includes("responsibilities") || q.includes("staff engineer")) {
    keywords = ["autonomy", "execution", "design", "ownership", "mentoring", "tech direction"];
    modelAnswer = "SDE-1 is responsible for task execution and clean code delivery. SDE-2 has system autonomy, taking end-to-end design ownership and mentoring peers. SDE-3/Staff Engineers provide technical direction, solve strategic system bottle-necks, and align engineering across teams.";
  }
  
  return { keywords, modelAnswer };
}

function renderNotesGridHTML() {
  let gridHTML = '';
  let matchesCount = 0;
  
  DATA.forEach(g => {
    if (!g.subjects) return;
    
    g.subjects.forEach(s => {
      let subjectNotesHTML = '';
      
      (s.topics || []).forEach(t => {
        const noteContent = notes[t.id] || '';
        if (!noteContent.trim()) return;
        
        const cleanQuery = notesSearchQuery.trim().toLowerCase();
        if (cleanQuery && !t.name.toLowerCase().includes(cleanQuery) && !noteContent.toLowerCase().includes(cleanQuery)) {
          return;
        }
        
        matchesCount++;
        subjectNotesHTML += `
          <div class="nh-note-card anim" id="nh-card-${t.id}">
            <div class="nh-note-top">
              <a class="nh-topic-link" onclick="openPanel('${t.id}')" title="View details panel">${t.name}</a>
              <span style="font-size: 10px; color: var(--text3); font-family: var(--fm);">${s.lbl}</span>
            </div>
            <textarea class="nh-textarea" oninput="updateGlobalNote('${t.id}', this.value)" placeholder="Edit notes...">${escapeHtml(noteContent)}</textarea>
            <div style="display:flex; justify-content:space-between; align-items:center; font-size:10.5px; color:var(--text3);">
              <span id="nh-char-${t.id}">${noteContent.length} characters</span>
              <button class="open-btn" style="padding: 2px 6px; font-size: 9px; border-color: var(--red); color: var(--red);" onclick="deleteGlobalNote('${t.id}')">Delete</button>
            </div>
          </div>`;
      });
      
      if (subjectNotesHTML) {
        gridHTML += `
          <div class="nh-subject-section" id="nh-sect-${s.id}">
            <div class="nh-subject-header">
              <span>${s.ico}</span>
              <span>${s.title}</span>
            </div>
            <div class="nh-notes-list">
              ${subjectNotesHTML}
            </div>
          </div>`;
      }
    });
  });
  
  if (matchesCount === 0) {
    return `<div class="empty">No notes match the search keyword "${escapeHtml(notesSearchQuery)}".</div>`;
  }
  
  return gridHTML;
}

function filterGlobalNotes(val) {
  notesSearchQuery = val;
  const grid = document.getElementById('nh-notes-grid');
  if (grid) {
    grid.innerHTML = renderNotesGridHTML();
  }
}

function updateGlobalNote(tid, val) {
  notes[tid] = val;
  saveNotes();
  const charSpan = document.getElementById(`nh-char-${tid}`);
  if (charSpan) {
    charSpan.textContent = val.length + ' characters';
  }
  
  if (!val.trim()) {
    deleteGlobalNoteCard(tid);
  }
}

function deleteGlobalNote(tid) {
  if (confirm('Are you sure you want to delete notes for this topic?')) {
    notes[tid] = '';
    saveNotes();
    deleteGlobalNoteCard(tid);
  }
}

function deleteGlobalNoteCard(tid) {
  const card = document.getElementById(`nh-card-${tid}`);
  if (card) {
    card.remove();
  }
  
  DATA.forEach(g => {
    if (!g.subjects) return;
    g.subjects.forEach(s => {
      const sect = document.getElementById(`nh-sect-${s.id}`);
      if (sect) {
        const list = sect.querySelector('.nh-notes-list');
        if (list && list.children.length === 0) {
          sect.remove();
        }
      }
    });
  });
  
  const grid = document.getElementById('nh-notes-grid');
  if (grid && grid.children.length === 0) {
    notesSearchQuery = '';
    renderNotesHub();
  }
}

function confirmDeleteAllNotes() {
  if (confirm('🚨 CRITICAL WARNING: Are you sure you want to permanently delete all study notes across ALL subjects? This action cannot be undone.')) {
    notes = {};
    saveNotes();
    notesSearchQuery = '';
    renderNotesHub();
  }
}
